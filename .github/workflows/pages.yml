name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (เฉพาะไฟล์ PWA)
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js \
             icon-192.png icon-512.png icon-maskable-512.png \
             apple-touch-icon.png favicon.ico _site/
          mkdir -p _site/supply
          cp supply/index.html supply/manifest.json supply/sw.js _site/supply/

      - name: Configure Pages (เปิด Pages ให้อัตโนมัติ)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
