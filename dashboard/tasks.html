<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกาะงาน — ติดตามงานธนาคารเลือด</title>
<meta name="description" content="แดชบอร์ดติดตามงานประจำวัน รายสัปดาห์ รายเดือน สไตล์เกาะลอยฟ้า 3D ธนาคารเลือด โรงพยาบาลสุราษฎร์ธานี">
<meta name="theme-color" content="#4aa3e0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1a2e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เกาะงาน">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mitr:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#8ed0ff; --sky2:#bfe6ff; --sky3:#e8f6ff;
  --ink:#1f2d3d; --mute:#5f7183; --card:#ffffff; --line:#e4edf5;
  --daily:#f59e0b; --daily2:#fdba74; --daily-d:#b45309;
  --weekly:#10b981; --weekly2:#6ee7b7; --weekly-d:#047857;
  --monthly:#8b5cf6; --monthly2:#c4b5fd; --monthly-d:#6d28d9;
  --hub:#ef4476; --hub2:#ff9db8; --hub-d:#be123c;
  --ok:#16a34a; --okbg:#dcfce7; --warn:#d97706; --warnbg:#fef3c7;
  --late:#dc2626; --latebg:#fee2e2;
  --shadow:0 10px 30px rgba(31,55,90,.14);
  --panel-bg:rgba(255,255,255,.72);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky1:#13325a; --sky2:#0e2543; --sky3:#0b1a2e;
  --ink:#e8eef6; --mute:#9fb2c6; --card:#132337; --line:#24364d;
  --daily:#fbbf24; --daily2:#92610c; --daily-d:#fde68a;
  --weekly:#34d399; --weekly2:#0b5e45; --weekly-d:#6ee7b7;
  --monthly:#a78bfa; --monthly2:#4c3a85; --monthly-d:#ddd6fe;
  --hub:#fb7185; --hub2:#7a2540; --hub-d:#fecdd3;
  --ok:#4ade80; --okbg:#0f3d2a; --warn:#fbbf24; --warnbg:#3a2a08;
  --late:#f87171; --latebg:#3b1414;
  --shadow:0 12px 34px rgba(0,0,0,.45);
  --panel-bg:rgba(19,35,55,.68);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky1:#13325a; --sky2:#0e2543; --sky3:#0b1a2e;
  --ink:#e8eef6; --mute:#9fb2c6; --card:#132337; --line:#24364d;
  --daily:#fbbf24; --daily2:#92610c; --daily-d:#fde68a;
  --weekly:#34d399; --weekly2:#0b5e45; --weekly-d:#6ee7b7;
  --monthly:#a78bfa; --monthly2:#4c3a85; --monthly-d:#ddd6fe;
  --hub:#fb7185; --hub2:#7a2540; --hub-d:#fecdd3;
  --ok:#4ade80; --okbg:#0f3d2a; --warn:#fbbf24; --warnbg:#3a2a08;
  --late:#f87171; --latebg:#3b1414;
  --shadow:0 12px 34px rgba(0,0,0,.45);
  --panel-bg:rgba(19,35,55,.68);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,var(--sky3) 100%);
  background-attachment:fixed;min-height:100dvh;overflow-x:hidden}
.mitr{font-family:"Mitr",sans-serif}

/* ===== Top bar ===== */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:12px 16px calc(12px);backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));
}
:root[data-theme="dark"] .bar,
@media (prefers-color-scheme:dark){}
.bar .logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#e9f3ff);box-shadow:0 6px 0 #c9def2,0 10px 20px rgba(31,55,90,.25);font-size:24px}
.bar h1{font-size:19px;line-height:1.15;font-weight:700}
.bar .sub{font-size:12.5px;color:var(--mute)}
.bar .right{margin-left:auto;display:flex;gap:8px}
.icbtn{width:42px;height:42px;border:0;border-radius:13px;cursor:pointer;font-size:18px;
  background:linear-gradient(145deg,#fff,#eaf3fb);color:var(--ink);
  box-shadow:0 5px 0 #c9def2,0 9px 16px rgba(31,55,90,.2);transition:transform .1s}
:root[data-theme="dark"] .icbtn,:root[data-theme="dark"] .bar .logo{background:linear-gradient(145deg,#1b2f49,#132337);box-shadow:0 5px 0 #0c1626,0 9px 16px rgba(0,0,0,.4)}
.icbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9def2}

/* ===== Sky scene ===== */
.scene{position:relative;max-width:1060px;margin:0 auto;padding:4px 12px 8px;min-height:430px}
.sun{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#fff6c2,#ffd23f 58%,#ffb02e);
  box-shadow:0 0 44px 10px rgba(255,208,63,.6);animation:breathe 5s ease-in-out infinite;z-index:1}
.cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(.3px);opacity:.92;z-index:1}
:root[data-theme="dark"] .cloud{background:#24395a;opacity:.5}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{width:70px;height:26px;top:60px;left:8%;animation:drift 26s linear infinite}
.c1::before{width:34px;height:34px;top:-15px;left:12px}.c1::after{width:26px;height:26px;top:-10px;left:40px}
.c2{width:84px;height:28px;top:30px;right:10%;animation:drift 34s linear infinite reverse}
.c2::before{width:40px;height:40px;top:-18px;left:14px}.c2::after{width:28px;height:28px;top:-9px;left:48px}
.rainbow-arc{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:460px;height:230px;max-width:92vw;
  border-radius:50% 50% 0 0/100% 100% 0 0;z-index:0;opacity:.7;
  background:
    radial-gradient(circle at bottom,transparent 61%,#ff5d5d 61% 65%,#ffa93d 65% 69%,#ffe24a 69% 73%,#7bd957 73% 77%,#5db6ff 77% 81%,#9a7bff 81% 85%,transparent 85%);
  filter:saturate(1.05)}

@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}

.cluster{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;
  grid-template-areas:"hub hub hub" "daily weekly monthly";gap:4px 10px;align-items:end;padding-top:70px}
.hub-wrap{grid-area:hub;justify-self:center;margin-bottom:2px}

/* Floating island */
.island{position:relative;width:100%;max-width:210px;margin:0 auto;cursor:pointer;
  text-align:center;transform-style:preserve-3d;transition:transform .22s}
.island:hover{transform:translateY(-8px)}
.island.sel .grass{outline:3px solid var(--ic);outline-offset:4px}
.float{animation:bob var(--dur,4s) ease-in-out infinite;animation-delay:var(--del,0s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.bld{font-size:48px;line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));position:relative;z-index:3;
  margin-bottom:-6px;display:inline-block}
.grass{position:relative;width:150px;max-width:72%;height:46px;margin:0 auto;border-radius:50%;
  background:radial-gradient(ellipse at 50% 28%,#a7f3b6,#34d06a 62%,#1aa34e);
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.1),0 2px 0 rgba(255,255,255,.4) inset;z-index:2}
.rock{position:relative;margin-top:-16px;z-index:1;filter:drop-shadow(0 20px 16px rgba(20,40,70,.3))}
.rock i{display:block;margin:-10px auto 0;border-radius:50%;
  background:linear-gradient(180deg,#9c6b3f,#6b4423 60%,#4a2f17)}
.rock i:nth-child(1){width:112px;height:26px;margin-top:0}
.rock i:nth-child(2){width:78px;height:22px}
.rock i:nth-child(3){width:46px;height:20px}
.rock i:nth-child(4){width:20px;height:16px;background:linear-gradient(180deg,#5a3a1d,#3a2410)}

.label{margin-top:10px;font-weight:700;font-size:15px}
.count{font-size:12px;color:var(--mute);margin-top:1px}

/* progress ring badge on island */
.ring{position:absolute;top:2px;right:8px;z-index:4;width:52px;height:52px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:13px;
  font-family:"Mitr",sans-serif;color:var(--ic)}

/* hub bigger */
.hub-wrap .island{max-width:240px}
.hub-wrap .bld{font-size:60px}
.hub-wrap .grass{width:180px;height:54px}
.hub-wrap .rock i:nth-child(1){width:130px}

/* rainbow bridges (decorative, desktop) */
.bridge{position:absolute;height:14px;width:150px;border-radius:40px;z-index:1;opacity:.75;
  background:repeating-linear-gradient(90deg,#ff5d5d 0 5px,#ffa93d 5px 10px,#ffe24a 10px 15px,#7bd957 15px 20px,#5db6ff 20px 25px,#9a7bff 25px 30px);
  box-shadow:0 6px 10px rgba(31,55,90,.18)}
.bridge.bl{top:150px;left:24%;transform:rotate(34deg)}
.bridge.bm{top:150px;left:50%;transform:translateX(-50%) rotate(0);width:70px}
.bridge.br{top:150px;right:24%;transform:rotate(-34deg)}
@media(max-width:720px){.bridge{display:none}}

/* ===== Board ===== */
.board{max-width:1060px;margin:0 auto;padding:6px 14px 44px;position:relative;z-index:3}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px}
.tab{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;
  background:var(--panel-bg);color:var(--mute);backdrop-filter:blur(8px);
  box-shadow:0 4px 0 rgba(31,55,90,.12);display:flex;align-items:center;gap:7px;transition:transform .1s}
.tab .em{font-size:16px}
.tab.on{color:#fff;box-shadow:0 5px 0 var(--td),0 10px 18px rgba(31,55,90,.2);transform:translateY(-1px)}
.tab.on[data-p="all"]{background:linear-gradient(145deg,var(--hub),var(--hub-d));--td:var(--hub-d)}
.tab.on[data-p="daily"]{background:linear-gradient(145deg,var(--daily),var(--daily-d));--td:var(--daily-d)}
.tab.on[data-p="weekly"]{background:linear-gradient(145deg,var(--weekly),var(--weekly-d));--td:var(--weekly-d)}
.tab.on[data-p="monthly"]{background:linear-gradient(145deg,var(--monthly),var(--monthly-d));--td:var(--monthly-d)}

.panel{margin-bottom:22px}
.phead{display:flex;align-items:center;gap:12px;margin:4px 2px 12px}
.phead .pem{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;
  box-shadow:0 6px 0 var(--pd),0 10px 18px rgba(31,55,90,.2)}
.phead h2{font-size:18px;font-weight:700}
.phead .psub{font-size:12.5px;color:var(--mute)}
.phead .pbar{flex:1;min-width:60px;height:12px;border-radius:8px;background:rgba(127,127,127,.2);overflow:hidden;max-width:220px}
.phead .pbar i{display:block;height:100%;border-radius:8px;transition:width .5s;background:linear-gradient(90deg,var(--pc),var(--pc2))}
.phead .pnum{font-family:"Mitr",sans-serif;font-weight:700;font-size:15px;color:var(--pc);min-width:52px;text-align:right}

.tasks{display:grid;gap:11px}
.task{background:var(--card);border-radius:18px;padding:14px 15px;box-shadow:0 7px 0 var(--te),0 12px 22px rgba(31,55,90,.1);
  border:1px solid var(--line);transition:transform .14s,box-shadow .14s;position:relative}
.task:hover{transform:translateY(-3px)}
.task.done{opacity:.66}
.trow{display:flex;align-items:flex-start;gap:13px}
.check{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid var(--pc);cursor:pointer;
  background:transparent;display:grid;place-items:center;color:#fff;font-size:16px;transition:all .15s;margin-top:1px}
.check:hover{transform:scale(1.08)}
.task.done .check{background:var(--pc);border-color:var(--pc)}
.tmain{flex:1;min-width:0}
.tname{font-weight:600;font-size:15px;line-height:1.35}
.task.done .tname{text-decoration:line-through;color:var(--mute)}
.tmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(127,127,127,.14);color:var(--mute);
  display:inline-flex;align-items:center;gap:4px}
.chip.time{background:var(--warnbg);color:var(--warn)}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.todo{background:rgba(127,127,127,.16);color:var(--mute)}
.exp{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--mute);font-size:13px;display:flex;align-items:center;gap:3px;padding:4px}
.detail{display:none;margin:12px 0 2px;padding:12px 14px;border-radius:14px;background:rgba(127,127,127,.07);border:1px dashed var(--line)}
.task.open .detail{display:block}
.task.open .exp .arw{transform:rotate(180deg)}
.arw{transition:transform .2s;display:inline-block}
.detail .note{font-size:13.5px;color:var(--mute);line-height:1.6;margin-bottom:8px}
.steps{display:grid;gap:7px}
.step{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.step .sc{width:20px;height:20px;border-radius:6px;border:2px solid var(--pc);flex:none;display:grid;place-items:center;color:#fff;font-size:12px}
.step.on .sc{background:var(--pc)}
.step.on span{text-decoration:line-through;color:var(--mute)}

.pfoot{display:flex;justify-content:flex-end;margin-top:10px}
.reset{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:inherit;font-size:12.5px;
  color:var(--mute);cursor:pointer}
.reset:hover{color:var(--ink);border-color:var(--mute)}

.done-banner{display:none;align-items:center;gap:10px;background:var(--okbg);color:var(--ok);
  border-radius:14px;padding:11px 15px;font-weight:700;font-size:14px;margin-bottom:12px}
.panel.complete .done-banner{display:flex}

.foot{text-align:center;color:var(--mute);font-size:12px;padding:10px 16px 30px}
.foot a{color:inherit}

@media(max-width:560px){
  .cluster{grid-template-columns:1fr 1fr;grid-template-areas:"hub hub" "daily weekly" "monthly monthly";padding-top:54px;gap:14px 8px}
  .scene{min-height:400px;padding-bottom:0}
  .island{max-width:150px}.hub-wrap .island{max-width:170px}
  .bld{font-size:40px}.hub-wrap .bld{font-size:48px}
  .grass{height:40px}.hub-wrap .grass{height:46px}
  .ring{width:46px;height:46px}
  .bar h1{font-size:17px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="logo">🩸</div>
  <div>
    <h1 class="mitr">เกาะงาน</h1>
    <div class="sub">ติดตามงานธนาคารเลือด · รพ.สุราษฎร์ธานี</div>
  </div>
  <div class="right">
    <button class="icbtn" id="themeBtn" title="เปลี่ยนโหมดสี">🌓</button>
  </div>
</div>

<div class="scene">
  <div class="sun"></div>
  <div class="rainbow-arc"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="bridge bl"></div>
  <div class="bridge bm"></div>
  <div class="bridge br"></div>
  <div class="cluster" id="cluster"></div>
</div>

<div class="board">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="foot">
    แตะที่เกาะหรือแท็บเพื่อดูงานแต่ละช่วง · ติ๊กวงกลมเมื่อทำเสร็จ · กด “รายละเอียด” เพื่อดูขั้นตอนงาน<br>
    เครื่องหมายจะรีเซ็ตอัตโนมัติเมื่อขึ้นวัน/สัปดาห์/เดือนใหม่ · <a href="index.html">← กลับแดชบอร์ดผู้บริหาร</a>
  </div>
</div>

<script>
// ===== Task data (blood bank recurring work) =====
var PERIODS={
  daily:{name:"งานรายวัน",emoji:"🍄",bld:"🍄",ic:"var(--daily)",pc:"#f59e0b",pc2:"#fdba74",pd:"#b45309",te:"#fde9c8",
    desc:"งานที่ต้องทำทุกวันก่อน/ระหว่าง/หลังออกหน่วย",
    items:[
      {id:"d1",t:"ลงชื่อเข้าเวร / เช็คชื่อทีม",owner:"ทุกคน",time:"07:45",
        note:"เจ้าหน้าที่ลงชื่อเข้าเวรผ่านระบบ และหัวหน้าทีมเช็คความพร้อมของสมาชิกทุกคนก่อนเริ่มงาน",
        steps:["เปิดระบบลงชื่ออยู่เวร","ตรวจรายชื่อครบตามเวร","แจ้งผู้ที่ยังไม่มา"]},
      {id:"d2",t:"ตรวจเช็ครถและอุปกรณ์ออกหน่วย",owner:"พนง.ขับรถ",time:"08:00",
        note:"ตรวจน้ำมัน ลมยาง เตียงเจาะ เครื่องชั่ง และอุปกรณ์การแพทย์ให้พร้อมใช้งาน",
        steps:["เช็คน้ำมัน/ลมยาง","ตรวจเตียง-เก้าอี้เจาะ","นับชุดเจาะเก็บโลหิต","เช็คถังขยะติดเชื้อ"]},
      {id:"d3",t:"เบิกน้ำดื่ม / ขนม / ข้าวกล่อง",owner:"ธุรการ",time:"08:15",
        note:"เบิกของว่างตามจำนวนผู้บริจาคที่คาดการณ์ บันทึกผ่านระบบเบิกของ",
        steps:["ประเมินยอดผู้บริจาค","เบิกน้ำ/ขนม/ข้าว","บันทึกในระบบเบิกของ"]},
      {id:"d4",t:"เตรียมเอกสาร/แบบฟอร์มผู้บริจาค",owner:"พยาบาล",time:"08:20",
        note:"เตรียมแบบคัดกรอง ใบยินยอม และสติกเกอร์ติดถุงโลหิตให้เพียงพอ",steps:[]},
      {id:"d5",t:"บันทึกยอดผู้บริจาคประจำวัน",owner:"นักเทคนิค",time:"ระหว่างวัน",
        note:"บันทึกจำนวนผู้มาบริจาค ผ่านเกณฑ์ และปริมาณโลหิตที่ได้ลงระบบ",steps:[]},
      {id:"d6",t:"สรุปงาน & ส่งรายงานปิดวัน",owner:"หัวหน้าทีม",time:"16:00",
        note:"สรุปยอดโลหิต จำนวนผู้บริจาค ปัญหาที่พบ และส่งรายงานปิดวันให้หัวหน้างาน",
        steps:["สรุปยอดโลหิตวันนี้","ทำความสะอาดอุปกรณ์","ส่งรายงานปิดวัน"]}
    ]},
  weekly:{name:"งานรายสัปดาห์",emoji:"🌳",bld:"🌳",ic:"var(--weekly)",pc:"#10b981",pc2:"#6ee7b7",pd:"#047857",te:"#c9f3e2",
    desc:"งานที่ทำสัปดาห์ละครั้ง",
    items:[
      {id:"w1",t:"ตรวจนับสต็อกถุงเลือดคงคลัง",owner:"นักเทคนิค",time:"จันทร์",
        note:"ตรวจนับถุงเลือดแต่ละหมู่ เทียบกับระบบ และตรวจวันหมดอายุที่ใกล้ถึง",

        steps:["รวบรวมข้อมูลทั้งเดือน","ทำกราฟ/ตารางสรุป","เสนอผู้บริหาร"]},

        note:"ประสานหน่วยงาน นัดหมายวันออกหน่วย และลงแผนในระบบเวรแพทย์",
        steps:["ติดต่อหน่วยงานเป้าหมาย","กำหนดวัน-สถานที่","ลงแผนในระบบ","มอบหมายแพทย์"]},
      {id:"m3",t:"ตรวจสอบวันหมดอายุเวชภัณฑ์/น้ำยา",owner:"นักเทคนิค",time:"กลางเดือน",
        note:"ตรวจน้ำยาตรวจหมู่เลือด ชุดเจาะ และเวชภัณฑ์ จัดการของใกล้หมดอายุ",steps:[]},
      {id:"m4",t:"เบิกวัสดุคลังประจำเดือน",owner:"ธุรการ",time:"ปลายเดือน",
        note:"สรุปวัสดุที่ใช้ และเบิกเติมสต็อกให้พร้อมสำหรับเดือนถัดไป",steps:[]},
      {id:"m5",t:"บำรุงรักษารถออกหน่วยประจำเดือน",owner:"พนง.ขับรถ",time:"ปลายเดือน",
        note:"เช็คระยะ เปลี่ยนถ่ายน้ำมันเครื่องตามรอบ และตรวจสภาพรถ",steps:[]},
      {id:"m6",t:"ประเมินผล & ขอบคุณทีมงาน",owner:"หัวหน้างาน",time:"สิ้นเดือน",
        note:"ทบทวนผลงานร่วมกัน ชื่นชมทีม และรับฟังข้อเสนอแนะเพื่อพัฒนางาน",steps:[]}
    ]}
};
var ORDER=["daily","weekly","monthly"];

// ===== period keys (auto-reset) =====
function pad(n){return n<10?"0"+n:""+n}
function dayKey(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function weekKey(){var d=new Date();var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var day=(t.getDay()+6)%7;t.setDate(t.getDate()-day+3);var f=new Date(t.getFullYear(),0,4);
  var w=1+Math.round(((t-f)/86400000-3+((f.getDay()+6)%7))/7);return t.getFullYear()+"-W"+pad(w)}
function monthKey(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function keyFor(p){return p==="daily"?dayKey():p==="weekly"?weekKey():monthKey()}
function storeKey(p){return "bbtask:"+p+":"+keyFor(p)}

var STATE={};
ORDER.forEach(function(p){
  var raw={};try{raw=JSON.parse(localStorage.getItem(storeKey(p))||"{}")}catch(e){}
  STATE[p]=raw||{};
});
function save(p){try{localStorage.setItem(storeKey(p),JSON.stringify(STATE[p]))}catch(e){}}
function isDone(p,id){return !!(STATE[p][id]&&STATE[p][id].done)}
function stepOn(p,id,i){return !!(STATE[p][id]&&STATE[p][id].steps&&STATE[p][id].steps[i])}

// ===== progress =====
function prog(p){var it=PERIODS[p].items,d=0;it.forEach(function(x){if(isDone(p,x.id))d++});
  return {done:d,total:it.length,pct:it.length?Math.round(d/it.length*100):0}}

var cur="daily";

// ===== render islands =====
function island(p,isHub){
  var P=PERIODS[p],g=prog(p),C=2*Math.PI*22,off=C*(1-g.pct/100);
  var durs={hub:4.6,daily:4,weekly:5.2,monthly:4.4},dels={hub:0,daily:.3,weekly:.8,monthly:1.1};
  return '<div class="island float'+(cur===p?' sel':'')+'" data-p="'+p+'" style="--ic:'+P.ic+';--dur:'+durs[p]+'s;--del:'+dels[p]+'s">'
    +'<div class="ring"><svg width="52" height="52" viewBox="0 0 52 52">'
      +'<circle cx="26" cy="26" r="22" fill="none" stroke="rgba(127,127,127,.25)" stroke-width="5"/>'
      +'<circle cx="26" cy="26" r="22" fill="none" stroke="'+P.ic+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
    +'</svg><div class="pct">'+g.pct+'</div></div>'
    +'<div class="bld">'+P.bld+'</div>'
    +'<div class="grass"></div>'
    +'<div class="rock"><i></i><i></i><i></i><i></i></div>'
    +'<div class="label">'+P.name+'</div>'
    +'<div class="count">'+g.done+'/'+g.total+' งานเสร็จ</div>'
  +'</div>';
}
function renderCluster(){
  var h='<div class="hub-wrap">'+hubIsland()+'</div>';
  h+=ORDER.map(function(p){return island(p)}).join("");
  document.getElementById("cluster").innerHTML=h;
}
function hubIsland(){
  var tot=0,don=0;ORDER.forEach(function(p){var g=prog(p);tot+=g.total;don+=g.done});
  var pct=tot?Math.round(don/tot*100):0,C=2*Math.PI*22,off=C*(1-pct/100);
  return '<div class="island float" data-p="all" style="--ic:var(--hub);--dur:4.6s">'
    +'<div class="ring"><svg width="52" height="52" viewBox="0 0 52 52">'
      +'<circle cx="26" cy="26" r="22" fill="none" stroke="rgba(127,127,127,.25)" stroke-width="5"/>'
      +'<circle cx="26" cy="26" r="22" fill="none" stroke="var(--hub)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
    +'</svg><div class="pct" style="color:var(--hub)">'+pct+'</div></div>'
    +'<div class="bld">🏰</div><div class="grass"></div>'
    +'<div class="rock"><i></i><i></i><i></i><i></i></div>'
    +'<div class="label">ภาพรวมงาน</div><div class="count">'+don+'/'+tot+' งานรวม</div></div>';
}

// ===== render tabs =====
function renderTabs(){
  var tabs=[["all","🏰","ทั้งหมด"],["daily","🍄","รายวัน"],["weekly","🌳","รายสัปดาห์"],["monthly","🔮","รายเดือน"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){
    return '<button class="tab'+((cur===t[0]||(cur==="all"&&t[0]==="all"))?' on':'')+'" data-p="'+t[0]+'"><span class="em">'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");
}

// ===== render panels =====
function panelHTML(p){
  var P=PERIODS[p],g=prog(p);
  var h='<div class="panel'+(g.pct===100?' complete':'')+'" data-p="'+p+'" style="--pc:'+P.pc+';--pc2:'+P.pc2+';--pd:'+P.pd+';--te:'+P.te+'">';
  h+='<div class="phead"><div class="pem" style="background:linear-gradient(145deg,'+P.pc+','+P.pd+');color:#fff">'+P.emoji+'</div>'
    +'<div style="flex:none"><h2>'+P.name+'</h2><div class="psub">'+P.desc+'</div></div>'
    +'<div class="pbar"><i style="width:'+g.pct+'%"></i></div><div class="pnum">'+g.done+'/'+g.total+'</div></div>';
  h+='<div class="done-banner">🎉 เยี่ยมมาก! งาน'+P.name.replace("งาน","")+'เสร็จครบแล้ว</div>';
  h+='<div class="tasks">';
  P.items.forEach(function(x){
    var done=isDone(p,x.id);
    h+='<div class="task'+(done?' done':'')+'" data-p="'+p+'" data-id="'+x.id+'">'
      +'<div class="trow">'
        +'<div class="check" data-act="toggle">'+(done?'✓':'')+'</div>'
        +'<div class="tmain"><div class="tname">'+esc(x.t)+'</div>'
          +'<div class="tmeta"><span class="chip">👤 '+esc(x.owner)+'</span>'
          +(x.time?'<span class="chip time">🕐 '+esc(x.time)+'</span>':'')
          +'<span class="tag '+(done?'ok':'todo')+'">'+(done?'เสร็จแล้ว':'ยังไม่ทำ')+'</span></div></div>'
        +((x.note||(x.steps&&x.steps.length))?'<button class="exp" data-act="exp">รายละเอียด <span class="arw">▾</span></button>':'')
      +'</div>';
    if(x.note||(x.steps&&x.steps.length)){
      h+='<div class="detail">';
      if(x.note)h+='<div class="note">'+esc(x.note)+'</div>';
      if(x.steps&&x.steps.length){
        h+='<div class="steps">';
        x.steps.forEach(function(s,i){
          var on=stepOn(p,x.id,i);
          h+='<div class="step'+(on?' on':'')+'" data-act="step" data-i="'+i+'"><span class="sc">'+(on?'✓':'')+'</span><span>'+esc(s)+'</span></div>';
        });
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="pfoot"><button class="reset" data-act="reset" data-p="'+p+'">ล้างเครื่องหมายทั้งหมด</button></div>';
  h+='</div>';
  return h;
}
function renderPanels(){
  var show=cur==="all"?ORDER:[cur];
  document.getElementById("panels").innerHTML=show.map(panelHTML).join("");
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function refresh(){renderCluster();renderTabs();renderPanels()}

// ===== events =====
document.getElementById("cluster").addEventListener("click",function(e){
  var isl=e.target.closest(".island");if(!isl)return;
  cur=isl.dataset.p;refresh();
  document.querySelector(".board").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab");if(!b)return;cur=b.dataset.p;refresh();
});
document.getElementById("panels").addEventListener("click",function(e){
  var act=e.target.closest("[data-act]");if(!act)return;
  var a=act.dataset.act,task=e.target.closest(".task");
  if(a==="toggle"&&task){
    var p=task.dataset.p,id=task.dataset.id;
    STATE[p][id]=STATE[p][id]||{};STATE[p][id].done=!STATE[p][id].done;save(p);refresh();return;
  }
  if(a==="exp"&&task){task.classList.toggle("open");return;}
  if(a==="step"&&task){
    var p2=task.dataset.p,id2=task.dataset.id,i=+act.dataset.i;
    STATE[p2][id2]=STATE[p2][id2]||{};STATE[p2][id2].steps=STATE[p2][id2].steps||{};
    STATE[p2][id2].steps[i]=!STATE[p2][id2].steps[i];save(p2);
    // keep panel open after step toggle
    var wasOpen=task.classList.contains("open");refresh();
    if(wasOpen){var nt=document.querySelector('.task[data-id="'+id2+'"]');if(nt)nt.classList.add("open")}
    return;
  }
  if(a==="reset"){
    var pr=act.dataset.p;if(confirm("ล้างเครื่องหมายงาน"+PERIODS[pr].name+"ทั้งหมด?")){STATE[pr]={};save(pr);refresh()}
    return;
  }
});

// ===== theme =====
var THEME="auto";
try{var t0=localStorage.getItem("tasksTheme");if(["auto","light","dark"].indexOf(t0)>=0)THEME=t0}catch(e){}
function applyTheme(){document.documentElement.setAttribute("data-theme",THEME==="auto"?"":THEME)}
applyTheme();
document.getElementById("themeBtn").onclick=function(){
  THEME=THEME==="auto"?"dark":THEME==="dark"?"light":"auto";
  try{localStorage.setItem("tasksTheme",THEME)}catch(e){}applyTheme();
};

refresh();
</script>
