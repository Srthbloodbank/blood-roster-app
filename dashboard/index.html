<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แดชบอร์ดผู้บริหาร — ธนาคารเลือด</title>
<meta name="description" content="แดชบอร์ดสรุปภาพรวมงานธนาคารเลือด โรงพยาบาลสุราษฎร์ธานี สำหรับผู้บริหาร">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard BB">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --mute: #64748b;
  --line: #e2e8f0; --acc: #a4162b; --accink: #fff; --ok: #16a34a;
  --okbg: #dcfce7; --warn: #d97706; --warnbg: #fef3c7; --info: #2563eb;
  --infobg: #dbeafe; --navy: #0f172a; --navy2: #1e293b;
  --kpi1: #ef4444; --kpi2: #3b82f6; --kpi3: #10b981; --kpi4: #f59e0b;
  --grad-top: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #020617; --card: #0f172a; --ink: #e2e8f0; --mute: #94a3b8;
    --line: #1e293b; --acc: #fb7185; --accink: #1c0a0e; --ok: #4ade80;
    --okbg: #052e16; --warn: #fbbf24; --warnbg: #422006; --info: #60a5fa;
    --infobg: #172554; --navy: #020617; --navy2: #0f172a;
    --grad-top: linear-gradient(135deg, #020617 0%, #0c1e3a 50%, #020617 100%);
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
    --shadow-lg: 0 4px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #020617; --card: #0f172a; --ink: #e2e8f0; --mute: #94a3b8;
  --line: #1e293b; --acc: #fb7185; --accink: #1c0a0e; --ok: #4ade80;
  --okbg: #052e16; --warn: #fbbf24; --warnbg: #422006; --info: #60a5fa;
  --infobg: #172554; --navy: #020617; --navy2: #0f172a;
  --grad-top: linear-gradient(135deg, #020617 0%, #0c1e3a 50%, #020617 100%);
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 "IBM Plex Sans Thai", system-ui, sans-serif; min-height: 100dvh }

/* Header */
.topbar { background: var(--grad-top); color: #fff; padding: 20px 16px 18px; border-bottom: 3px solid var(--acc) }
.topbar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 14px }
.topbar-icon { flex: none; width: 48px; height: 48px; background: rgba(255,255,255,.12); border-radius: 14px; display: grid; place-items: center }
.topbar-icon svg { width: 28px; height: 28px }
.topbar h1 { font-size: 20px; font-weight: 800; line-height: 1.25 }
.topbar .sub { color: #94a3b8; font-size: 13px; font-weight: 500 }
.topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center }
.topbar-right .clock { font-size: 14px; font-weight: 600; color: #94a3b8; font-variant-numeric: tabular-nums }
.btn-icon { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 10px; width: 40px; height: 40px; cursor: pointer; font-size: 16px; display: grid; place-items: center }
.btn-icon:hover { background: rgba(255,255,255,.2) }

/* Nav */
.nav { background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 0; z-index: 10 }
.nav-inner { max-width: 1200px; margin: 0 auto; display: flex; padding: 0 8px }
.nav button { border: 0; background: none; color: var(--mute); font: inherit; font-weight: 600; font-size: 14px; padding: 14px 16px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px }
.nav button.on { color: var(--acc); border-color: var(--acc); font-weight: 700 }
.nav button:hover:not(.on) { color: var(--ink) }

/* Main */
.main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px }

/* KPI Row */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px }
.kpi:nth-child(1)::before { background: var(--kpi1) }
.kpi:nth-child(2)::before { background: var(--kpi2) }
.kpi:nth-child(3)::before { background: var(--kpi3) }
.kpi:nth-child(4)::before { background: var(--kpi4) }
.kpi-label { font-size: 13px; color: var(--mute); font-weight: 600; margin-bottom: 6px }
.kpi-val { font-size: 32px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums }
.kpi:nth-child(1) .kpi-val { color: var(--kpi1) }
.kpi:nth-child(2) .kpi-val { color: var(--kpi2) }
.kpi:nth-child(3) .kpi-val { color: var(--kpi3) }
.kpi:nth-child(4) .kpi-val { color: var(--kpi4) }
.kpi-sub { font-size: 12px; color: var(--mute); margin-top: 4px }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 18px }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line) }
.card-h h2 { font-size: 16px; font-weight: 700; flex: 1 }
.card-h .dot { width: 8px; height: 24px; border-radius: 4px; flex: none }
.card-h .badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap }
.card-body { padding: 16px 18px }
.card-link { display: block; padding: 12px 18px; border-top: 1px solid var(--line); text-align: center; color: var(--info); font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer }
.card-link:hover { background: var(--infobg) }

/* Grid layouts */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px }

/* Today bar */
.today-bar { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--info); border-radius: 16px; padding: 18px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow-lg) }
.today-bar .tdate { text-align: center; flex: none; width: 64px }
.today-bar .tdate b { display: block; font-size: 36px; font-weight: 800; color: var(--info); line-height: 1 }
.today-bar .tdate span { font-size: 12px; color: var(--mute) }
.today-bar .tinfo { flex: 1 }
.today-bar .tinfo h3 { font-size: 17px; font-weight: 700; margin-bottom: 2px }
.today-bar .tinfo p { font-size: 14px; color: var(--mute); line-height: 1.5 }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 14px }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle }
th { font-size: 12px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .5px; background: color-mix(in srgb, var(--card) 60%, var(--bg)) }
tbody tr:last-child td { border-bottom: 0 }
tbody tr:hover { background: color-mix(in srgb, var(--info) 5%, var(--card)) }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600 }
.tag-ok { background: var(--okbg); color: var(--ok) }
.tag-warn { background: var(--warnbg); color: var(--warn) }
.tag-info { background: var(--infobg); color: var(--info) }

/* Attendance */
.att-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line) }
.att-row:last-child { border-bottom: 0 }
.att-avatar { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none }
.att-name { flex: 1 }
.att-name b { display: block; font-size: 14px }
.att-name span { font-size: 12px; color: var(--mute) }
.att-status { flex: none; font-size: 13px; font-weight: 600 }

/* Supply bars */
.supply-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.supply-item:last-child { border-bottom: 0 }
.supply-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none }
.supply-info { flex: 1 }
.supply-info b { display: block; font-size: 14px; margin-bottom: 4px }
.supply-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden }
.supply-bar div { height: 100%; border-radius: 4px; transition: width .6s ease }
.supply-val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; flex: none; min-width: 48px; text-align: right }

/* Chart bars */
.hbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
.hbar-label { width: 90px; font-size: 13px; font-weight: 500; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hbar-track { flex: 1; height: 24px; background: var(--line); border-radius: 6px; overflow: hidden; position: relative }
.hbar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 700; color: #fff; min-width: fit-content; transition: width .8s ease }
.hbar-val { flex: none; width: 36px; font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums }

/* Quick links */
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px }
.quick-link { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; text-align: center; cursor: pointer; transition: transform .15s, box-shadow .15s }
.quick-link:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg) }
.quick-link .ql-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px }

/* Section heading */
.sec-head { font-size: 17px; font-weight: 700; margin: 28px 0 14px; padding-left: 12px; border-left: 4px solid var(--acc) }
.sec-head:first-child { margin-top: 0 }

/* Empty */
.empty { text-align: center; padding: 28px 16px; color: var(--mute); font-size: 14px }

/* Admin mode */
.adminbar{display:flex;align-items:center;gap:10px;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);
  border-radius:14px;padding:12px 16px;margin-bottom:18px;font-weight:600;font-size:14px}
.adminbar .ab-x{margin-left:auto;background:var(--warn);color:#fff;border:0;border-radius:9px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:700}
.aedit{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:70px}
.aedit:focus{outline:2px solid var(--info);border-color:var(--info)}
.adel{background:var(--latebg);color:var(--late);border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit;font-weight:700;white-space:nowrap}
.aadd{display:inline-flex;align-items:center;gap:7px;background:var(--ok);color:#fff;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;font:inherit;font-weight:700;margin:14px 0 4px}
.asaved{font-size:12.5px;color:var(--ok);margin-left:10px;font-weight:600}
.amodal{position:fixed;inset:0;z-index:100;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;padding:18px}
.amodal.on{display:flex}
.abox{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:360px;box-shadow:var(--shadow-lg)}
.abox h3{font-size:18px;font-weight:700;margin-bottom:4px}
.abox .amini{font-size:13px;color:var(--mute);margin-bottom:14px}
.abox input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
.abox .aerr{color:var(--late);font-size:13px;min-height:18px;margin-top:6px}
.abox .arow{display:flex;gap:10px;margin-top:14px}
.abtn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;cursor:pointer;font:inherit;font-weight:600}
.abtn.p{background:var(--info);color:#fff;border-color:var(--info);font-weight:700}

/* Responsive */
@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr) }
  .grid-2, .grid-3 { grid-template-columns: 1fr }
  .quick-grid { grid-template-columns: repeat(2, 1fr) }
}
@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px }
  .kpi { padding: 14px 12px }
  .kpi-val { font-size: 26px }
  .topbar h1 { font-size: 17px }
  .today-bar { flex-direction: column; text-align: center; gap: 10px }
  .quick-grid { grid-template-columns: 1fr 1fr }
  .hbar-label { width: 60px; font-size: 12px }
}
</style>
</head>

function attKey(){var d=new Date();return "bbatt:"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function loadAtt(){try{var r=localStorage.getItem(attKey());if(r){var a=JSON.parse(r);if(a&&a.length)return a}}catch(e){}
  return DEFAULT_ATT.map(function(x){return Object.assign({},x)})}
function saveAtt(){try{localStorage.setItem(attKey(),JSON.stringify(ATTENDANCE))}catch(e){}
  var s=document.getElementById("asaved");if(s){s.textContent="✓ บันทึกแล้ว";clearTimeout(window._at);window._at=setTimeout(function(){if(s)s.textContent=""},1600)}}
var ATTENDANCE=loadAtt();
var ATT_STATUS=[["present","มาปกติ"],["late","มาสาย"],["absent","ขาด"],["leave","ลา"]];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function thaiDate(s){var d=pd(s);return d.getDate()+" "+M[d.getMonth()]+" "+(d.getFullYear()+543)}
function shortDate(s){var d=pd(s);return d.getDate()+" "+MS[d.getMonth()]}
function docName(c){var d=DOCS.filter(function(x){return x.code===c})[0];return d?d.name:c}
function curMonth(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function evMonth(ym){return EVENTS.filter(function(e){return e.date.slice(0,7)===ym&&e.codes.length>0})}
function supMonth(ym){return SUPPLY_RECORDS.filter(function(r){return r.date.slice(0,7)===ym})}

function statusLabel(s){
  if(s==="present") return '<span class="tag tag-ok">มาปกติ</span>';
  if(s==="late") return '<span class="tag tag-warn">มาสาย</span>';
  if(s==="absent") return '<span class="tag" style="background:#fee2e2;color:#dc2626">ขาด</span>';
  if(s==="leave") return '<span class="tag" style="background:#f3e8ff;color:#7c3aed">ลา</span>';
  return s;
}
function statusColor(s){
  if(s==="present") return "#16a34a";
  if(s==="late") return "#d97706";
  if(s==="absent") return "#dc2626";
  if(s==="leave") return "#7c3aed";
  return "#64748b";
}

  var totalWater=mSupply.reduce(function(a,r){return a+r.water},0);
  var totalSnack=mSupply.reduce(function(a,r){return a+r.snack},0);
  var totalRice=mSupply.reduce(function(a,r){return a+r.rice},0);

  var h='<div class="sec-head">ระบบเบิกของออกหน่วย — '+M[new Date().getMonth()]+' '+(new Date().getFullYear()+543)+'</div>';

  // Summary cards
  h+='<div class="kpi-grid">';
  h+='<div class="kpi"><div class="kpi-label">ผู้บริจาคทั้งหมด</div><div class="kpi-val">'+totalDonors.toLocaleString()+'</div><div class="kpi-sub">ราย · '+mSupply.length+' ครั้ง</div></div>';
  h+='<div class="kpi"><div class="kpi-label">น้ำดื่ม</div><div class="kpi-val">'+totalWater.toLocaleString()+'</div><div class="kpi-sub">ขวด</div></div>';
  h+='<div class="kpi"><div class="kpi-label">ขนม</div><div class="kpi-val">'+totalSnack.toLocaleString()+'</div><div class="kpi-sub">ชิ้น</div></div>';
  h+='<div class="kpi"><div class="kpi-label">ข้าวกล่อง</div><div class="kpi-val">'+totalRice.toLocaleString()+'</div><div class="kpi-sub">กล่อง</div></div>';
  h+='</div>';

  // Records table
  h+='<div class="card"><div class="card-h"><div class="dot" style="background:var(--warn)"></div><h2>รายการเบิกของเดือนนี้</h2></div>';
  h+='<div class="card-body" style="padding:0;overflow-x:auto"><table><thead><tr><th>วันที่</th><th>สถานที่</th><th style="text-align:right">ผู้บริจาค</th><th style="text-align:right">💧 น้ำ</th><th style="text-align:right">🍪 ขนม</th><th style="text-align:right">🍚 ข้าว</th></tr></thead><tbody>';
  mSupply.forEach(function(r){
    h+='<tr><td style="white-space:nowrap">'+shortDate(r.date)+'</td><td>'+esc(r.place)+'</td><td style="text-align:right;font-weight:700;color:var(--info)">'+r.donors+'</td><td style="text-align:right">'+r.water+'</td><td style="text-align:right">'+r.snack+'</td><td style="text-align:right">'+r.rice+'</td></tr>';
  });
  if(!mSupply.length) h+='<tr><td colspan="6" class="empty">ยังไม่มีข้อมูลเดือนนี้</td></tr>';
  h+='<tr style="font-weight:700;background:color-mix(in srgb,var(--info) 8%,var(--card))"><td colspan="2" style="text-align:right">รวมทั้งเดือน</td><td style="text-align:right;color:var(--info)">'+totalDonors+'</td><td style="text-align:right">'+totalWater+'</td><td style="text-align:right">'+totalSnack+'</td><td style="text-align:right">'+totalRice+'</td></tr>';
  h+='</tbody></table></div></div>';

  // Donors per unit chart
  var sorted=mSupply.slice().sort(function(a,b){return b.donors-a.donors});
  var maxD=sorted.length?sorted[0].donors:1;
  h+='<div class="card"><div class="card-h"><div class="dot" style="background:var(--kpi2)"></div><h2>ยอดผู้บริจาคแต่ละหน่วย</h2></div><div class="card-body">';
  var barColors=["#ef4444","#f97316","#f59e0b","#84cc16","#22c55e","#06b6d4","#3b82f6","#8b5cf6","#a855f7","#ec4899","#f43f5e","#64748b"];
  sorted.forEach(function(r,i){
    h+='<div class="hbar"><div class="hbar-label" title="'+esc(r.place)+'">'+esc(r.place)+'</div><div class="hbar-track"><div class="hbar-fill" style="width:'+Math.round(r.donors/maxD*100)+'%;background:'+barColors[i%barColors.length]+'">'+r.donors+'</div></div></div>';
  });
  h+='</div></div>';

  return h;
}

function renderAttendance(){
  var present=ATTENDANCE.filter(function(a){return a.status==="present"}).length;
  var late=ATTENDANCE.filter(function(a){return a.status==="late"}).length;
  var absent=ATTENDANCE.filter(function(a){return a.status==="absent"}).length;
  var leave=ATTENDANCE.filter(function(a){return a.status==="leave"}).length;
  var total=ATTENDANCE.length;

  var h='<div class="sec-head">ลงชื่ออยู่เวร — '+new Date().getDate()+' '+M[new Date().getMonth()]+' '+(new Date().getFullYear()+543)+'</div>';
  if(ADMIN)h+='<div class="adminbar">🔧 โหมดหัวหน้า/แอดมิน — แก้ไขข้อมูลได้เลย ระบบบันทึกให้อัตโนมัติ<button class="ab-x" data-act="logout">ออกจากโหมดแอดมิน</button></div>';

  // Attendance KPIs
  h+='<div class="kpi-grid">';
  h+='<div class="kpi"><div class="kpi-label">มาปกติ</div><div class="kpi-val" style="color:var(--ok)">'+present+'</div><div class="kpi-sub">คน</div></div>';
  h+='<div class="kpi"><div class="kpi-label">มาสาย</div><div class="kpi-val" style="color:var(--warn)">'+late+'</div><div class="kpi-sub">คน</div></div>';
  h+='<div class="kpi"><div class="kpi-label">ขาด</div><div class="kpi-val" style="color:#dc2626">'+absent+'</div><div class="kpi-sub">คน</div></div>';
  h+='<div class="kpi"><div class="kpi-label">ลา</div><div class="kpi-val" style="color:#7c3aed">'+leave+'</div><div class="kpi-sub">คน</div></div>';
  h+='</div>';

  // Attendance percentage bar
  var pctPresent=Math.round(present/total*100);
  h+='<div class="card" style="margin-bottom:18px"><div class="card-body">';
  h+='<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px"><div style="font-size:42px;font-weight:800;color:var(--ok)">'+pctPresent+'%</div><div><div style="font-weight:700;font-size:16px">อัตราการมาปฏิบัติงาน</div><div style="color:var(--mute);font-size:13px">เจ้าหน้าที่พร้อมปฏิบัติงาน '+present+' จาก '+total+' คน</div></div></div>';
  h+='<div style="height:12px;background:var(--line);border-radius:6px;overflow:hidden;display:flex">';
  h+='<div style="width:'+(present/total*100)+'%;background:var(--ok)"></div>';
  h+='<div style="width:'+(late/total*100)+'%;background:var(--warn)"></div>';
  h+='<div style="width:'+(absent/total*100)+'%;background:#dc2626"></div>';
  h+='<div style="width:'+(leave/total*100)+'%;background:#7c3aed"></div>';
  h+='</div>';
  h+='<div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--mute);flex-wrap:wrap">';
  h+='<span>🟢 มาปกติ '+present+'</span><span>🟡 สาย '+late+'</span><span>🔴 ขาด '+absent+'</span><span>🟣 ลา '+leave+'</span>';
  h+='</div></div></div>';

  // Full attendance list
  h+='<div class="card"><div class="card-h"><div class="dot" style="background:var(--ok)"></div><h2>รายชื่อเจ้าหน้าที่</h2>'+(ADMIN?'<span class="asaved" id="asaved"></span>':'')+'</div>';
  h+='<div class="card-body" style="padding:0;overflow-x:auto"><table><thead><tr><th>ชื่อ</th><th>ตำแหน่ง</th><th>เบอร์โทร</th><th>เวลาเข้าเวร</th><th>สถานะ</th>'+(ADMIN?'<th></th>':'')+'</tr></thead><tbody>';
  ATTENDANCE.forEach(function(a,i){
    if(ADMIN){
      var opts=ATT_STATUS.map(function(s){return '<option value="'+s[0]+'"'+(a.status===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join("");
      h+='<tr data-i="'+i+'">'
        +'<td><input class="aedit" data-f="name" value="'+esc(a.name)+'"></td>'
        +'<td><input class="aedit" data-f="role" value="'+esc(a.role)+'"></td>'
        +'<td><input class="aedit" data-f="tel" value="'+esc(a.tel)+'"></td>'
        +'<td><input class="aedit" data-f="time" value="'+esc(a.time)+'" placeholder="เช่น 07:50 หรือ -"></td>'
        +'<td><select class="aedit" data-f="status">'+opts+'</select></td>'
        +'<td><button class="adel" data-act="del" data-i="'+i+'">ลบ</button></td></tr>';
    } else {
      h+='<tr><td><b>'+esc(a.name)+'</b></td><td>'+esc(a.role)+'</td><td style="color:var(--mute)">'+esc(a.tel)+'</td><td>'+(a.time&&a.time!=="-"?esc(a.time)+' น.':'<span style="color:var(--mute)">-</span>')+'</td><td>'+statusLabel(a.status)+'</td></tr>';
    }
  });
  h+='</tbody></table></div>';
  if(ADMIN)h+='<div style="padding:4px 16px 16px"><button class="aadd" data-act="add">➕ เพิ่มเจ้าหน้าที่</button></div>';
  h+='</div>';

  return h;
}

function render(){
  var h;
  if(tab==="overview") h=renderOverview();
  else if(tab==="roster") h=renderRoster();
  else if(tab==="supply") h=renderSupply();
  else if(tab==="attendance") h=renderAttendance();
  else h=renderOverview();
  document.getElementById("app").innerHTML=h;

  var btns=document.querySelectorAll("#tabs button");
  btns.forEach(function(b){b.className=b.getAttribute("data-t")===tab?"on":""});
}

function switchTab(t){tab=t;render();window.scrollTo(0,0)}

document.getElementById("tabs").addEventListener("click",function(e){
  var t=e.target.closest("button");
  if(t&&t.dataset.t){switchTab(t.dataset.t)}
});

// ===== admin edit events =====
var app=document.getElementById("app");
app.addEventListener("input",function(e){
  var f=e.target.closest(".aedit");if(!f||!ADMIN)return;
  var tr=e.target.closest("tr[data-i]");if(!tr)return;
  var i=+tr.dataset.i,field=f.dataset.f,v=f.value;
  if(field==="time"&&v.trim()==="")v="-";
  ATTENDANCE[i][field]=v;saveAtt();
});
app.addEventListener("change",function(e){
  var f=e.target.closest("select.aedit");if(!f||!ADMIN)return;
  var tr=e.target.closest("tr[data-i]");if(!tr)return;
  ATTENDANCE[+tr.dataset.i].status=f.value;saveAtt();render(); // re-render to refresh summary bars
});
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act;
  if(a==="logout"){ADMIN=false;render();return}
  if(!ADMIN)return;
  if(a==="del"){if(confirm("ลบเจ้าหน้าที่คนนี้?")){ATTENDANCE.splice(+b.dataset.i,1);saveAtt();render()}return}
  if(a==="add"){ATTENDANCE.push({name:"เจ้าหน้าที่ใหม่",role:"",tel:"",status:"present",time:"-"});saveAtt();render();
    setTimeout(function(){var rows=document.querySelectorAll('tr[data-i] input[data-f="name"]');var last=rows[rows.length-1];if(last){last.focus();last.select()}},0);return}
});

// ===== admin login =====
var amodal=document.getElementById("amodal");
function openLogin(){document.getElementById("aerr").textContent="";document.getElementById("apw").value="";amodal.classList.add("on");setTimeout(function(){document.getElementById("apw").focus()},50)}
function closeLogin(){amodal.classList.remove("on")}
function tryLogin(){
  var v=document.getElementById("apw").value.trim().toLowerCase();
  if(v===ADMIN_PW){ADMIN=true;closeLogin();if(tab!=="attendance")switchTab("attendance");else render()}
  else document.getElementById("aerr").textContent="รหัสผ่านไม่ถูกต้อง";
}
document.getElementById("adminBtn").onclick=function(){if(ADMIN){ADMIN=false;render()}else openLogin()};
document.getElementById("alogin").onclick=tryLogin;
document.getElementById("acancel").onclick=closeLogin;
document.getElementById("apw").addEventListener("keydown",function(e){if(e.key==="Enter")tryLogin()});
amodal.addEventListener("click",function(e){if(e.target===amodal)closeLogin()});

// Clock
function updateClock(){
  var d=new Date();
  var s=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  var el=document.getElementById("clock");
  if(el) el.textContent=W[d.getDay()]+" "+d.getDate()+" "+MS[d.getMonth()]+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
updateClock();setInterval(updateClock,30000);

// Theme
var THEME="auto";
try{var t0=localStorage.getItem("dashTheme");if(["auto","light","dark"].indexOf(t0)>=0)THEME=t0}catch(e){}
function applyTheme(){document.documentElement.setAttribute("data-theme",THEME==="auto"?"":THEME)}
applyTheme();
document.getElementById("themeBtn").onclick=function(){
  THEME=THEME==="auto"?"dark":THEME==="dark"?"light":"auto";
  try{localStorage.setItem("dashTheme",THEME)}catch(e){}
  applyTheme();
};

// Refresh
document.getElementById("refreshBtn").onclick=function(){render()};

render();
</script>
</body>
</html>
