<html lang="th">
<head>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#15202b;--mute:#5b6b7b;--line:#d3dce6;--acc:#a4162b;--accink:#fff;--ok:#1d7a4d;--head:#e3eaf2;--soft:#fff4d6;--warn:#c77d00;--navy:#14263a;--today:#d9f1e3;--todayink:#0f5132;--tb:#1d7a4d;--tbi:#fff;--erbg:#e1ecf8;--erink:#14416e;--tdy:#1d4ed8;--tdybg:#e4ecfd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 16px 16px;border-bottom:3px solid var(--acc);display:flex;gap:12px;align-items:center}
header svg{flex:none}.hb{margin-left:auto;flex:none;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}.hb:hover{background:rgba(255,255,255,.12)}h1{font-size:19px;line-height:1.3;margin:0;font-weight:700}.sub{color:#b8c6d4;font-size:13px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-weight:500;padding:13px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}

main{padding:16px;max-width:980px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.grow{flex:1;min-width:0}
button.b,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 11px}
button.b{cursor:pointer;font-weight:500}button.b:hover{border-color:var(--mute)}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}button.p:hover{border-color:var(--acc);filter:brightness(1.08)}
button.d{color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%}input[type="radio"]{width:auto;accent-color:var(--acc)}textarea{font-family:ui-monospace,Menlo,monospace;font-size:14px;min-height:160px}
.mbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mbar b{flex:1;text-align:center;font-size:18px;font-weight:700}
.mbar button{width:42px;height:42px;padding:0;font-size:20px;border-radius:50%}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:middle;text-align:left}
th{background:var(--head);font-weight:700;font-size:13px;color:var(--mute)}
tbody tr:last-child td{border-bottom:0}
td.c{text-align:center;white-space:nowrap}td.n{white-space:nowrap}.dn{font-weight:700;color:var(--acc)}
.none{color:var(--acc);font-size:13px}.tel{color:var(--mute);font-size:12px;white-space:nowrap}.g.b3{grid-template-columns:70px 1fr 120px auto}.g.c4{grid-template-columns:60px 1fr 130px auto}
tr.ch td{background:var(--soft)}td.tdy{background:var(--today)!important;color:var(--todayink);font-weight:700}.badge.today{background:var(--tb);color:var(--tbi)}.chg s{color:var(--mute)}
.trvline{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:8px;font-size:14px;line-height:1.45}.trvline.self{background:var(--today);color:var(--todayink)}.trvline.er{background:var(--erbg);color:var(--erink)}.trvline.wait{background:var(--soft);color:var(--ink)}.trvline a{color:inherit;font-weight:700}
.extraline{display:inline-block;margin-top:4px;margin-right:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;background:var(--head);color:var(--mute)}
.extraline.co{background:var(--erbg);color:var(--erink)}
.badge{display:inline-block;background:var(--warn);color:#1a1100;font-size:11px;font-weight:700;border-radius:999px;padding:0 9px;white-space:nowrap}.badge.trv{background:var(--head);color:var(--ink);border:1px solid var(--mute)}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:14px}
.adm{text-align:center;margin:26px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}.pwwrap{position:relative}.pwwrap input{padding-right:46px}.eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:var(--mute);line-height:0}.eye svg{width:22px;height:22px}
.mute{color:var(--mute);font-size:13px}.ok{color:var(--ok);font-size:13px}.err{color:var(--acc);font-size:13px}
h2{font-size:16px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.g{display:grid;gap:6px;margin-bottom:6px}.g.a{grid-template-columns:64px 1fr auto}.g.b2{grid-template-columns:76px 1fr auto}
.sheet{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
@media (min-width:641px){.sheet{align-items:center}.sheet>div{border-radius:12px}}
@media (max-width:640px){
.wrap{background:none;border:0;overflow:visible}
table.r,table.r tbody{display:block}table.r thead{display:none}
table.r tr{display:grid;grid-template-columns:70px 1fr;column-gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:12px 14px}
table.r tr.ch{border-left:5px solid var(--warn)}table.r tr.ch td{background:none}
table.r td{display:block;border:0;padding:0;text-align:left!important;white-space:normal!important}
table.r td:nth-child(1){grid-area:1/1;font-size:12px;color:var(--mute)}
table.r td:nth-child(2){grid-area:2/1/5/2}
table.r td.dd .dn,table.r td.dd span{display:block}table.r td.dd .dn{font-size:30px;line-height:1.05}table.r td.dd span{font-size:12px;color:var(--mute)}
table.r td:nth-child(3){grid-area:1/2;font-weight:700}
table.r td:nth-child(4){grid-area:2/2;font-size:13px;color:var(--mute)}table.r td:nth-child(4)::before{content:"เวลา "}
table.r td:nth-child(5){grid-area:3/2;margin-top:6px}
table.r td.tdy{padding:5px 9px;border-radius:6px;justify-self:start}table.r td.bt{grid-area:5/1/6/3;margin-top:12px}
table.r td.bt button{width:100%;min-height:44px;padding:11px 14px;font-size:15px}
table.r td.bt button+button{margin-top:8px!important}
button.b,.mbar button{min-height:44px}
.sheet>div .row button.b{min-height:44px}
input,select,textarea{min-height:44px;padding:11px 13px}
textarea{min-height:160px}
nav button{min-height:44px}}

#tb{margin-left:auto;display:flex;align-items:center;gap:6px}#tb svg{width:18px;height:18px}#hb{margin-left:8px}@media (max-width:640px){#tb .tl{display:none}#tb{padding:7px 9px}}

:var(--ink);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;line-height:1.4;width:max-content;max-width:190px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.18)}.pr-foot .bub{top:auto;bottom:100%;left:50%;margin:0 0 6px;transform:translateX(-50%)}.pr.say .bub{opacity:1}@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-10px)}55%{transform:translateY(0)}75%{transform:translateY(-3px)}100%{transform:translateY(0)}}.pr.hop{animation:hop .65s ease-out 1}@media (max-width:640px){header{--hh:96px;gap:8px;padding:12px 12px 12px calc(var(--tw) + 12px)}h1{font-size:17px}.sub{font-size:12px;line-height:1.35}nav button{padding:13px 11px}}.van{animation:drive 13s linear infinite}.whl{transform-box:fill-box;transform-origin:center;animation:spin 1.3s linear infinite}.dash{stroke-dashoffset:0;animation:dash 2.6s linear infinite}.sun{transform-box:fill-box;animation:sunb 4s ease-in-out infinite}.rays{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}.cl1{animation:cloud 26s linear infinite}.cl2{animation:cloud 34s linear infinite}.bird{transform-box:fill-box;animation:fly 11s linear infinite}@keyframes sunb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes cloud{from{transform:translateX(-90px)}to{transform:translateX(340px)}}@keyframes fly{0%{transform:translate(-60px,0)}50%{transform:translate(120px,-10px)}100%{transform:translate(300px,4px)}}.sbag{transform-box:fill-box;transform-origin:50% 100%;animation:hopbag 1.4s ease-in-out var(--sd) infinite}.tree{transform-box:fill-box;transform-origin:50% 100%;animation:swayT 3.2s ease-in-out var(--td) infinite}@keyframes swayT{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@keyframes hopbag{0%,100%{transform:translateY(0) scaleY(1)}25%{transform:translateY(-7px) scaleY(1.06)}45%{transform:translateY(0) scaleY(.94)}60%{transform:translateY(-3px) scaleY(1)}}@keyframes drive{0%{transform:translateX(-150px)}100%{transform:translateX(330px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-40}}.nomo *{animation:none!important}#mb{margin-left:auto}#tb{margin-left:6px}#mb,#tb{display:flex;align-items:center;gap:6px}#mb svg,#tb svg{width:18px;height:18px}@media (max-width:640px){#mb .tl,#tb .tl{display:none}#mb,#tb{padding:7px 9px}}

.sumwrap{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:0 0 30px}
.sumbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);z-index:2}
.sumbar b{font-size:15px;text-align:center}
.paper{background:#fff;color:#15202b;max-width:760px;margin:14px auto;padding:22px 26px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
.paper .ph{text-align:center;border-bottom:2px solid #a4162b;padding-bottom:8px;margin-bottom:12px}
.paper .pt{font-size:19px;font-weight:700}.paper .ps{font-size:13px;color:#5b6b7b;margin-top:2px}
.paper table.pb{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px}
.paper .pb th,.paper .pb td{border:1px solid #c3ced9;padding:4px 6px;vertical-align:top;text-align:left;line-height:1.45}
.paper .pb th{background:#eef2f6;font-weight:700;text-align:center}
.paper .st2{font-size:15px;font-weight:700;margin:14px 0 6px;border-left:4px solid #a4162b;padding-left:8px}
.paper .pf{font-size:12px;color:#44566b;line-height:1.7;border-top:1px solid #c3ced9;padding-top:8px}
.paper .sig{display:flex;justify-content:space-between;gap:20px;margin-top:26px;font-size:12px}
@media print{
 @page{size:A4 portrait;margin:12mm}
 html,body{background:#fff!important}
 body>header,body>nav,body>footer,.sumbar{display:none!important}
 #app>*{display:none!important}#app>.sumwrap{display:block!important}
 body>main{padding:0!important;max-width:none!important}
 .sumwrap{position:static;inset:auto;overflow:visible;padding:0;background:#fff}
 .paper{max-width:none;margin:0;padding:0;border-radius:0;box-shadow:none}
 .paper table.pb{font-size:11px}.paper .pb tr{break-inside:avoid}
 .paper .st2{break-before:auto}
}

.tdybar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tdy);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.tdyd{flex:none;width:52px;text-align:center;line-height:1.05}
.tdyd b{display:block;font-size:30px;font-weight:700;color:var(--tdy)}
.tdyd span{font-size:12px;color:var(--mute)}
.tdyt{font-weight:700;font-size:15px}
.tdys{font-size:13.5px;color:var(--mute);margin-top:2px;word-break:break-word}
.tdys a{color:var(--tdy);font-weight:700}
tr.tdyrow td{background:var(--tdybg)!important}
tr.tdyrow td.n,tr.tdyrow .dn{color:var(--tdy)!important}
.badge.today{background:var(--tdy);color:#fff}
td[data-l="แพทย์"]{font-size:13.5px;line-height:1.5;word-break:break-word;overflow-wrap:anywhere}
td[data-l="แพทย์"] .tel{font-size:11.5px}
td[data-l="สถานที่"]{word-break:break-word;overflow-wrap:anywhere}
@media (max-width:640px){
 table.r tr.tdyrow{border-left:6px solid var(--tdy)}
 table.r tr.tdyrow td{background:none!important}
 table.r tr.tdyrow{background:var(--tdybg)!important}
 table.r td[data-l="แพทย์"]{font-size:14px}
}

tr.lnrow td{padding:0;background:transparent !important;border:0}
.lnbox{background:var(--soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.lnbox .lnhd{margin:0 0 8px;font-weight:700;font-size:14px;color:var(--ink)}
.lnbox .lnhd .mute{font-weight:400;margin-left:6px}
.lnbox textarea{min-height:260px;font-family:inherit;font-size:14px;background:var(--card)}
.lnbox .row{margin:10px 0 0}
.lnmsg{min-height:18px;margin-top:6px;font-size:13px}
@media (max-width:640px){
  table.r tr.lnrow{display:block;background:none;border:0;padding:0;margin:-6px 0 10px 0}
  table.r tr.lnrow td{display:block;padding:0}
}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--navy);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--acc)}

.nofound{background:var(--soft);border:1px dashed var(--acc);border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:14px;line-height:1.6}
.nofound button{display:block;width:100%;margin-top:8px}

.badge.tent{background:var(--warn);color:#1a1100}
tr.tentrow td{background:var(--soft)}
@media (max-width:640px){table.r tr.tentrow{border-left:5px dashed var(--warn)}table.r tr.tentrow td{background:none}}
</style>
</head>

(function(){
var st={cfg:{},events:{},log:[]},ready=false,pend=0,last="",L={cfg:[],events:[],log:[]};
function sn(d,id){return {id:id,data:function(){return d}}}
function fire(){if(!ready)return;
  L.cfg.forEach(function(f){f(sn(st.cfg,"main"))});
  L.events.forEach(function(f){f({docs:Object.keys(st.events).map(function(k){return sn(st.events[k],k)})})});
  L.log.forEach(function(f){f({docs:st.log.slice(0,5).map(function(x){return sn(x,"")})})})}
function run(fn,a){return new Promise(function(ok,no){
  if(!window.google||!google.script)return no(new Error("no gas"));
  google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn].apply(null,a)})}
function sync(){return run("getState",[]).then(function(s){
  var j=JSON.stringify(s);if(j===last||pend)return;last=j;
  st.cfg=s.cfg;st.events={};s.events.forEach(function(e){st.events[e.id]=e});st.log=s.log;ready=true;fire()})}
function write(o){pend++;fire();
  return run("applyOps",[[o]]).then(function(){pend--;return sync()},function(e){pend--;last="";sync().catch(function(){});throw e})}
function w(a,d,m){
  if(a[0]==="cfg"){st.cfg=d;return write({t:"cfg",d:d})}
  var id=a[1];
  if(m===2){delete st.events[id];return write({t:"del",id:id})}
  var v=m===1?Object.assign({},st.events[id],d):d;st.events[id]=v;return write({t:"ev",id:id,d:v})}
var DB={
  doc:function(p){var a=p.split("/");return {
    onSnapshot:function(f){L.cfg.push(f);if(ready)fire();return function(){}},
    set:function(d){return w(a,d,0)},update:function(d){return w(a,d,1)},delete:function(){return w(a,null,2)}}},
  collection:function(c){return {
    orderBy:function(){return this},limit:function(){return this},
    onSnapshot:function(f){L[c].push(f);if(ready)fire();return function(){}},
    add:function(d){st.log.unshift(d);return write({t:"log",d:d})}}}};
var first=sync();
window.claude={use:function(){return first.then(function(){return DB},function(){return null})}};
setInterval(function(){if(!document.hidden)sync().catch(function(){})},10000);
})();
</script>
<script>
var M=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(c){return String(c||"").trim().toUpperCase()}
function pad(n){return n<10?"0"+n:""+n}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fdate(s){var d=pd(s);return d.getDate()+" "+M[d.getMonth()]+" "+(d.getFullYear()+543)}
function sdate(s){var d=pd(s);return d.getDate()+" "+M[d.getMonth()].slice(0,3)}
function mlabel(ym){var p=ym.split("-");return M[+p[1]-1]+" "+(+p[0]+543)}
function shiftM(ym,n){var p=ym.split("-"),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function doc(c){return S.docs.filter(function(x){return x.code===c})[0]}
function place(n){return S.places.filter(function(x){return +x.n===+n})[0]}
function coord(n){return S.coords.filter(function(x){return +x.n===+n})[0]}
function srt(l){return l.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function evs(ym){return srt(S.events.filter(function(e){return e.date.slice(0,7)===ym}))}
function dsort(a,b){var x=parseInt(String(a.code).replace(/\D/g,""),10)||0,y=parseInt(String(b.code).replace(/\D/g,""),10)||0;return x-y||String(a.code).localeCompare(String(b.code))}

function toast(m,bad){TOAST=(bad?"⚠ ":"✓ ")+m;var el=document.getElementById("toast");if(el){el.textContent=TOAST;el.className="toast show"+(bad?" bad":"")}clearTimeout(_tt);_tt=setTimeout(function(){TOAST="";var e2=document.getElementById("toast");if(e2)e2.className="toast"},2200)}
function cfgSave(m){db.doc("cfg/main").set({docs:S.docs,places:S.places,coords:S.coords,reserve:S.reserve,note:S.note}).then(function(){toast(m||"บันทึกลง Google ชีตแล้ว")},function(){toast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง",1)})}

function render(){
  var T=[["view","ตารางเวร"],["mine","เวรของฉัน"],["docs","รายชื่อแพทย์"]];T.push(["admin","แอดมิน"]);
  document.getElementById("tabs").innerHTML=T.map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
  var h;
  if(nodb)h='<div class="card">เชื่อมต่อข้อมูลไม่ได้ ลองรีเฟรชหน้านี้อีกครั้ง</div>';

  document.getElementById("app").innerHTML=h;
  if(FOCUS)setTimeout(function(){var fe=document.getElementById(FOCUS);if(fe){FOCUS="";fe.focus();if(fe.scrollIntoView)fe.scrollIntoView({block:"center"})}},0);
  var mb=document.getElementById("mb");if(mb){mb.innerHTML=(MOTION?PAUSE:PLAY)+'<span class="tl">'+(MOTION?"หยุดภาพเคลื่อนไหว":"เล่นภาพเคลื่อนไหว")+'</span>';mb.setAttribute("aria-label",MOTION?"หยุดภาพเคลื่อนไหว":"เล่นภาพเคลื่อนไหว");mb.setAttribute("title",MOTION?"หยุดภาพเคลื่อนไหว":"เล่นภาพเคลื่อนไหว")}
  var tb=document.getElementById("tb");if(tb){tb.innerHTML=themeIcon();tb.setAttribute("aria-label","โหมดสี: "+themeName()+" (แตะเพื่อเปลี่ยน)");tb.setAttribute("title","โหมดสี: "+themeName())}
}
var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.1A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>';
function vLogin(){return '<div class="sheet" id="sheet"><div><b>เข้าสู่โหมดแอดมิน</b><label for="pw">รหัสแอดมิน (พิมพ์เล็กหรือใหญ่ก็ได้)</label><div class="pwwrap"><input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="eye" type="button" data-a="eye" aria-label="แสดงรหัสผ่าน">'+EYE+'</button></div>'+(LGE?'<div class="err">รหัสไม่ถูกต้อง ลองกดรูปตาเพื่อตรวจตัวอักษร</div>':'')+'<div class="row" style="margin-top:14px"><button class="b" data-a="close">ยกเลิก</button><button class="b p grow" data-a="login">เข้าสู่ระบบ</button></div></div></div>'}

function chgd(e){return !!e.orig&&e.orig.slice().sort().join()!==e.codes.slice().sort().join()}
function docCell(e,pend){
  if(!e.codes.length&&!chgd(e))return '<span class="none">ยังไม่กำหนด</span>';
  var o=e.orig||e.codes,same=e.codes.filter(function(c){return o.indexOf(c)>=0}),add=e.codes.filter(function(c){return o.indexOf(c)<0}),rem=o.filter(function(c){return e.codes.indexOf(c)<0});

  var cols=btn?6:5;

  l.forEach(function(e){
    h+='<tr class="'+(chgd(e)?"ch ":"")+(e.tent?"tentrow ":"")+(e.date===today()?"tdyrow":"")+'" id="'+(e.date===today()?"todayrow":"")+'"><td class="n">'+W[pd(e.date).getDay()]+'</td><td class="n dd"><b class="dn">'+pd(e.date).getDate()+'</b> <span>'+M[pd(e.date).getMonth()]+' '+(pd(e.date).getFullYear()+543)+'</span></td><td data-l="สถานที่">'+placeCell(e)+(e.date===today()?' <span class="badge today">วันนี้</span>':'')+'</td><td class="c" data-l="เวลา">'+esc(e.time||"8.30 น.")+'</td><td data-l="แพทย์">'+docCell(e,btn==='travel'||btn===true)+'</td>'+(btn==='travel'?travelBtnCell(e):btn?'<td class="c bt"><button class="b" data-a="swap" data-id="'+e.id+'">แลกเวร</button>'+(e.codes.length?'<button class="b '+(e.travel&&e.travel.mode?'':'p')+'" data-a="trvOpen" data-id="'+e.id+'" style="margin-top:6px">'+(e.travel&&e.travel.mode?'✏️ แก้ไขข้อมูลออกหน่วย':'✅ ยืนยันข้อมูลออกหน่วย')+'</button>':'')+'</td>':'')+'</tr>';

function lnEditorRow(e,cols){

function todayBar(){
  var t=today(),d=pd(t),e=S.events.filter(function(x){return x.id===t})[0],p=e&&e.n?place(e.n):null;
  var h='<div class="tdybar"><div class="tdyd"><b>'+d.getDate()+'</b><span>'+M[d.getMonth()].slice(0,3)+'</span></div><div class="grow"><div class="tdyt">วัน'+W[d.getDay()]+'ที่ '+d.getDate()+' '+M[d.getMonth()]+' '+(d.getFullYear()+543)+'</div>';
  if(!e)h+='<div class="tdys">วันนี้ไม่มีแผนออกหน่วย</div>';
  else{
    h+='<div class="tdys">📍 '+(p?esc(p.name):'ยังไม่กำหนดหน่วย')+' · เวลา '+esc(e.time||"8.30 น.")+'</div>';
    h+='<div class="tdys">👨‍⚕️ '+(e.codes.length?e.codes.map(function(c){var x=doc(c);return esc(x?x.name:c)}).join(", "):'ยังไม่กำหนดแพทย์')+'</div>';
    var tv=e.travel||{};
    if(tv.mode==="self")h+='<div class="tdys">🚗 ไปเอง'+(tv.phone?' · โทร <a href="tel:'+esc(String(tv.phone).replace(/[^\d+]/g,""))+'">'+esc(tv.phone)+'</a>':'')+'</div>';
    else if(tv.mode==="er")h+='<div class="tdys">🏥 รอรับที่หน้า ER</div>';
    var co=e.n?coord(e.n):null;
    if(co&&co.name)h+='<div class="tdys">📞 ผู้ประสานงาน '+esc(co.name)+(co.tel?' '+esc(co.tel):'')+'</div>';
  }
  h+='</div>';
  if(e&&t.slice(0,7)===S.ym)h+='<button class="b" data-a="goToday">ดูในตาราง</button>';
  else if(e)h+='<button class="b" data-a="thisMonth">ไปเดือนนี้</button>';
  return h+'</div>';
}

async function delMonth(ym){
  try{
    await Promise.all(S.events.filter(function(e){return e.date.slice(0,7)===ym}).map(function(e){return db.doc("events/"+e.id).delete()}));
    if(ym===S.ym)AT="";
    amsg="✓ ลบแผนเดือน"+mlabel(ym)+"แล้ว";
  }catch(e){amsg="⚠ ลบไม่สำเร็จ ลองใหม่อีกครั้ง"}
  render();
}
function oldMonths(){
  var p=today().split("-"),d=new Date(+p[0],+p[1]-1-12,1),cut=d.getFullYear()+"-"+pad(d.getMonth()+1),out={};
  S.events.forEach(function(e){var k=e.date.slice(0,7);if(k<cut)out[k]=1});
  return Object.keys(out);
}

/* ค้นหาแพทย์ได้ทั้งรหัส ชื่อ และสตาร์ */
(function(){var c=document.createElement("style");c.textContent=".sug{display:block;width:100%;text-align:left;margin-top:6px}";document.head.appendChild(c)})();
function matchDocs(q){
  q=String(q||"").trim();if(!q)return [];
  var m=q.toUpperCase().match(/^D\d+/);if(m){var d=doc(m[0]);if(d)return [d]}
  var s=q.replace(/[\s*]/g,"");
  if(/^\d{3,}$/.test(s)){var r=S.docs.filter(function(x){return (x.tel||"").split(",").some(function(t){return t.replace(/[\s*]/g,"")===s})});if(r.length)return r}
  var strip=function(t){return String(t).toLowerCase().replace(/^(นพ\.|พญ\.)/,"").replace(/\s+/g," ").trim()},n=strip(q);
  return S.docs.filter(function(x){return strip(x.name).indexOf(n)>=0||(n.length>=2&&x.code.toLowerCase().indexOf(n)===0)});
}
function findDoc(q){var r=matchDocs(q);return r.length===1?r[0]:null}
function sugBtn(a){return function(d){return '<button class="b sug" data-a="'+a+'" data-code="'+esc(d.code)+'">'+esc(d.name)+' <span class="tel">'+esc(d.code)+(d.tel?' · '+esc(d.tel):'')+'</span></button>'}}
function frBox(e,q){
  if(!String(q||"").trim())return "";
  var r=matchDocs(q),f=r.length===1?r[0]:null;
  if(f)return e&&e.codes.indexOf(f.code)>=0?'<div class="err">เพื่อนอยู่ในเวรนี้อยู่แล้ว</div>':'<div class="ok">✓ '+esc(f.name)+' ('+esc(f.code)+(f.tel?' '+esc(f.tel):'')+')</div>';
  if(!r.length)return '<div class="err">ไม่พบรายชื่อนี้</div>';
  return '<div class="mute">พบ '+r.length+' คน แตะเพื่อเลือก</div>'+r.slice(0,6).map(sugBtn("pickfr")).join("");
}
function vMine(){
  var r=matchDocs(ME),d=r.length===1?r[0]:null,h='<label for="me2">รหัส ชื่อ หรือสตาร์ของคุณ</label><input id="me2" data-me="1" value="'+esc(ME)+'" placeholder="เช่น D01 / ดวงกมล / 9289" autocomplete="off">';
  if(!String(ME).trim())return h+'<p class="mute">พิมพ์รหัส ชื่อ หรือสตาร์เพื่อดูเวรของคุณ (ระบบจะจำไว้ในเครื่องนี้)</p>';
  if(!r.length)return h+'<div class="err">ไม่พบรายชื่อนี้</div>';
  if(!d)return h+'<div class="mute">พบ '+r.length+' คน แตะเพื่อเลือก</div>'+r.slice(0,8).map(sugBtn("pickme")).join("");
  var l=srt(S.events.filter(function(x){return x.date>=today()&&x.codes.indexOf(d.code)>=0}));
  return h+'<div class="ok">✓ '+esc(d.name)+' ('+esc(d.code)+')</div><h2>เวรที่กำลังจะถึง</h2>'+tbl(l,true,"ไม่มีเวรที่กำลังจะถึง");
}
var SWBK="";
function bkBox(e){
  var me=doc(SW.me),fr=findDoc(SW.fr);
  if(!(fr&&me&&e.codes.indexOf(fr.code)<0))return SWBK="";
  var back=srt(S.events.filter(function(x){return x.date>=today()&&x.codes.indexOf(fr.code)>=0&&x.codes.indexOf(me.code)<0}));
  return SWBK='<label for="bk">แลกกลับกับเวรของเพื่อน (ไม่บังคับ)</label><select id="bk" data-sw="back"><option value="">ไม่แลกกลับ</option>'+back.map(function(x){return '<option value="'+x.id+'"'+(SW.back===x.id?" selected":"")+'>'+esc(sdate(x.date))+' · '+esc(x.n&&place(x.n)?place(x.n).name:"-")+'</option>'}).join("")+'</select>';
}
function swChange(k,v){
  SW[k]=v;
  if(k==="fr"||k==="me")SW.back="";
  if(k!=="fr"){render();return}
  var e=S.events.filter(function(x){return x.id===SW.id})[0],b=document.getElementById("bkw");
  if(e&&b){var old=SWBK,h=bkBox(e);if(h!==old)b.innerHTML=h}
}
function vSheet(){
  var e=S.events.filter(function(x){return x.id===SW.id})[0];if(!e){SW=null;return ""}
  if(e.codes.length&&e.codes.indexOf(SW.me)<0)SW.me=e.codes[0];
  var me=doc(SW.me),fr=findDoc(SW.fr);
  var h='<div class="sheet" id="sheet"><div><b>แลกเวร '+esc(fdate(e.date))+'</b><div class="mute">'+placeCell(e).replace(/<[^>]+>/g,"")+'</div>';
  if(e.codes.length>1)h+='<label for="me">ผู้ที่ยกเวรให้เพื่อน</label><select id="me" data-sw="me">'+e.codes.map(function(c){var d=doc(c);return '<option value="'+esc(c)+'"'+(SW.me===c?" selected":"")+'>'+esc(d?d.name+" ("+c+")":c)+'</option>'}).join("")+'</select>';
  else h+='<div style="margin-top:10px"><span class="mute">เจ้าของเวรตอนนี้</span><br><b>'+(me?esc(me.name)+' ('+esc(me.code)+')':'ยังไม่กำหนด')+'</b></div>';
  h+='<label for="fr">เพื่อนที่รับแทน (พิมพ์รหัส ชื่อ หรือสตาร์)</label><input id="fr" data-sw="fr" value="'+esc(SW.fr)+'" placeholder="เช่น D02 / ดวงกมล / 9289" autocomplete="off"><div id="frs">'+frBox(e,SW.fr)+'</div><div id="bkw">'+bkBox(e)+'</div>';
  var ok=fr&&e.codes.indexOf(fr.code)<0;
  return h+(amsg?'<div class="err">'+esc(amsg)+'</div>':'')+'<div class="row" style="margin-top:14px"><button class="b" data-a="close">ยกเลิก</button><button class="b p grow" id="cfm" data-a="doSwap"'+(ok?"":" disabled")+'>ยืนยันแลกเวร</button></div></div></div>';
}
async function doSwap(){
  var ev=S.events.filter(function(x){return x.id===SW.id})[0],me=doc(SW.me),fr=findDoc(SW.fr),bk=S.events.filter(function(x){return x.id===SW.back})[0];
  if(!ev||!fr||ev.codes.indexOf(fr.code)>=0||(ev.codes.length&&(!me||ev.codes.indexOf(me.code)<0)))return;
  var t="วันที่ "+sdate(ev.date)+": "+(me?me.name:"ยังไม่กำหนด")+" → "+fr.name;
  try{
    await db.doc("events/"+ev.id).update({codes:me?ev.codes.map(function(c){return c===me.code?fr.code:c}):[fr.code],orig:ev.orig||ev.codes,travel:{mode:"",phone:""}});
    if(bk&&me){await db.doc("events/"+bk.id).update({codes:bk.codes.map(function(c){return c===fr.code?me.code:c}),orig:bk.orig||bk.codes,travel:{mode:"",phone:""}});t+=" (แลกกับเวร "+sdate(bk.date)+")"}
    await db.collection("log").add({t:t,ts:Date.now()});
    var ev2=S.events.filter(function(x){return x.id===SW.id})[0];
    SW=null;amsg="";if(ev2)LN={id:ev2.id,text:lineText([ev2],false)};
  }catch(e){amsg="บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง"}
  render();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="pickfr"&&SW){SW.fr=b.getAttribute("data-code");SW.back="";render()}
  else if(a==="pickme"){ME=b.getAttribute("data-code");try{localStorage.setItem("bloodMe",ME)}catch(x){}render()}
});
app.addEventListener("input",function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute("data-sw");
  if(k==="fr"&&SW){
    var ev=S.events.filter(function(x){return x.id===SW.id})[0];SW.fr=t.value;SW.back="";
    var a=document.getElementById("frs");if(a)a.innerHTML=frBox(ev,t.value);
    var b=document.getElementById("bkw");if(b)b.innerHTML=ev?bkBox(ev):"";
    var c=document.getElementById("cfm"),f=findDoc(t.value);if(c)c.disabled=!(f&&ev&&ev.codes.indexOf(f.code)<0);
  }else if(t.getAttribute&&t.getAttribute("data-me")){
    ME=t.value;try{localStorage.setItem("bloodMe",ME)}catch(x){}
    render();var q=document.getElementById("me2");if(q){q.focus();q.setSelectionRange(ME.length,ME.length)}
  }else if(t.id==="tvp"&&TV){TV.phone=t.value;var c2=document.getElementById("tvok");if(c2)c2.disabled=!tvValid()}
  else if(t.id==="tvt"&&TV){TV.type=t.value}
  else if(t.id==="tvv"&&TV){TV.vans=t.value}
  else if(t.id==="tvco"&&TV){TV.coName=t.value}
  else if(t.id==="tvcot"&&TV){TV.coTel=t.value}
  else if(t.id==="lntext"&&LN)LN.text=t.value;
});
