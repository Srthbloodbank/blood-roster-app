<title>แดชบอร์ดธนาคารเลือด</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Underwater 3D isometric dashboard — blood bank modules as ocean landmarks */
:root {
  --ocean1: #0a4d8c; --ocean2: #062a52; --ocean3: #041e3d;
  --sand: #e8d5a3; --coral: #ff6b81; --coral2: #ff4757;
  --teal: #00b894; --teal2: #00a381; --sky: #74b9ff; --sky2: #a3d8ff;
  --gold: #fdcb6e; --purple: #a29bfe; --pink: #fd79a8;
  --card: rgba(255,255,255,.92); --card2: rgba(255,255,255,.85);
  --ink: #1a1a2e; --mute: #546e8a; --line: rgba(0,80,160,.15);
  --glass: rgba(255,255,255,.18); --glassbr: rgba(255,255,255,.3);
  --okbg: #d5f5e3; --ok: #00a381; --warnbg: #fef3cd; --warn: #e67e22;
  --crim: #e74c3c; --crimbg: #fde8e8;
  --shadow-card: 0 8px 32px rgba(4,30,61,.25), 0 2px 8px rgba(4,30,61,.15);
  --shadow-float: 0 12px 40px rgba(4,30,61,.3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ocean1: #041e3d; --ocean2: #020f22; --ocean3: #010a16;
    --card: rgba(10,40,70,.88); --card2: rgba(10,40,70,.8);
    --ink: #e0ecf8; --mute: #7ea0c4; --line: rgba(100,180,255,.12);
    --glass: rgba(255,255,255,.08); --glassbr: rgba(255,255,255,.15);
    --okbg: #0a3d2e; --ok: #2ecc71; --warnbg: #3d2e0a; --warn: #f0b040;
    --crim: #ff6b81; --crimbg: #3d1520;
    --shadow-card: 0 8px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    --shadow-float: 0 12px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ocean1: #041e3d; --ocean2: #020f22; --ocean3: #010a16;
  --card: rgba(10,40,70,.88); --card2: rgba(10,40,70,.8);
  --ink: #e0ecf8; --mute: #7ea0c4; --line: rgba(100,180,255,.12);
  --glass: rgba(255,255,255,.08); --glassbr: rgba(255,255,255,.15);
  --okbg: #0a3d2e; --ok: #2ecc71; --warnbg: #3d2e0a; --warn: #f0b040;
  --crim: #ff6b81; --crimbg: #3d1520;
  --shadow-card: 0 8px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  --shadow-float: 0 12px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}

body {
  background: linear-gradient(180deg, var(--ocean1) 0%, var(--ocean2) 60%, var(--ocean3) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font: 15px/1.55 "IBM Plex Sans Thai", system-ui, sans-serif;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(30px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--ocean1);
  z-index: 30;
}
* { box-sizing: border-box }
h1,h2,h3 { margin: 0; font-family: "Fredoka","IBM Plex Sans Thai",sans-serif; text-wrap: balance }
button { font: inherit; cursor: pointer }
input, select { font: inherit; color: var(--ink); background: var(--glass); border: 1px solid var(--glassbr); border-radius: 12px; padding: 10px 12px; width: 100%; backdrop-filter: blur(6px) }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.tnum { font-variant-numeric: tabular-nums }

/* ===== Underwater scene ===== */
.ocean-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.bubble {
  position: absolute; bottom: -20px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), rgba(255,255,255,.08));
  border: 1px solid rgba(255,255,255,.2);
  animation: rise linear infinite;
}
@keyframes rise {
  0% { transform: translateY(0) translateX(0) scale(1); opacity: .7 }
  50% { transform: translateY(-50vh) translateX(15px) scale(1.1); opacity: .5 }
  100% { transform: translateY(-105vh) translateX(-10px) scale(.8); opacity: 0 }
}
.ray {
  position: absolute; top: -20%; width: 120px;
  background: linear-gradient(180deg, rgba(255,255,255,.06) 0%, transparent 100%);
  transform: rotate(15deg); border-radius: 50%;
  animation: rayPulse 6s ease-in-out infinite;
}
@keyframes rayPulse { 0%,100% { opacity: .3 } 50% { opacity: .6 } }
.fish {
  position: absolute; font-size: 22px; opacity: .5;
  animation: swim linear infinite;
}
@keyframes swim {
  0% { transform: translateX(-60px) translateY(0) scaleX(1) }
  49% { transform: translateX(calc(100vw + 60px)) translateY(-20px) scaleX(1) }
  50% { transform: translateX(calc(100vw + 60px)) translateY(-20px) scaleX(-1) }
  100% { transform: translateX(-60px) translateY(0) scaleX(-1) }
}

/* ===== Header ===== */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: linear-gradient(135deg, rgba(10,77,140,.85), rgba(6,42,82,.9));
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,.12);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
}
.bar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) 12px max(16px, env(safe-area-inset-right, 0px));
  max-width: 960px; margin: 0 auto;
}
.bar-icon {
  flex: none; width: 46px; height: 46px;
  background: linear-gradient(135deg, var(--coral), var(--crim));
  border-radius: 14px; display: grid; place-items: center;
  box-shadow: 0 4px 16px rgba(231,76,60,.35);
  font-size: 24px;
}
.bar .tt { flex: 1; min-width: 0 }
.bar .tt h1 { font-size: 21px; color: #fff; font-weight: 700 }
.bar .tt .sub { color: var(--sky2); font-size: 11.5px; font-weight: 500; letter-spacing: .5px }
.tbtn {
  flex: none; background: var(--glass); color: #fff;
  border: 1px solid var(--glassbr); border-radius: 12px;
  width: 40px; height: 40px; display: grid; place-items: center;
}
.tbtn:hover { background: rgba(255,255,255,.2) }
.tbtn svg { width: 20px; height: 20px }

/* ===== Clock ===== */
.clock-wrap {
  max-width: 960px; margin: 20px auto 8px;
  text-align: center; position: relative; z-index: 1;
}
.clock {
  display: inline-flex; align-items: center; gap: 12px;
  background: var(--glass); backdrop-filter: blur(16px);
  border: 1px solid var(--glassbr); border-radius: 20px;
  padding: 12px 24px; box-shadow: var(--shadow-float);
}
.clock-time {
  font-family: "Fredoka", sans-serif;
  font-size: 38px; font-weight: 700; color: #fff;
  letter-spacing: 2px; font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 12px rgba(0,80,200,.4);
}
.clock-time .sec { font-size: 22px; color: var(--sky2); font-weight: 500 }
.clock-date {
  text-align: left; color: var(--sky2); font-size: 13px; font-weight: 500;
  line-height: 1.4;
}
.clock-date b { color: #fff; font-size: 15px; display: block }
.pulse-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--teal); flex: none;
  animation: pulse 2s ease-in-out infinite;
  box-shadow: 0 0 8px var(--teal);
}
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .5; transform: scale(.7) } }

/* ===== Isometric map grid ===== */
.map {
  max-width: 960px; margin: 20px auto 0;
  display: grid; gap: 18px;
  grid-template-columns: 1fr;
  position: relative; z-index: 1;
  perspective: 1200px;
}
@media (min-width: 720px) {
  .map { grid-template-columns: 1fr 1fr; }
  .map .island.wide { grid-column: 1 / -1 }
}

/* ===== 3D Island cards ===== */
.island {
  position: relative;
  transform-style: preserve-3d;
  transition: transform .35s cubic-bezier(.25,.46,.45,.94);
}
.island:hover { transform: translateY(-4px) }
.island-platform {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
  position: relative;
}
.island-platform::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, transparent 60%);
  pointer-events: none; border-radius: 20px;
}
.island-base {
  height: 14px; margin: 0 12px;
  background: linear-gradient(180deg, rgba(0,60,120,.15), rgba(0,60,120,.05));
  border-radius: 0 0 16px 16px;
  transform: perspective(400px) rotateX(8deg);
}

/* Island header */
.isle-head {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px 12px;
  position: relative;
}
.isle-icon {
  width: 48px; height: 48px; border-radius: 16px;
  display: grid; place-items: center; flex: none;
  font-size: 24px; position: relative; overflow: hidden;
}
.isle-icon::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.3) 0%, transparent 60%);
  border-radius: 16px;
}
.isle-icon.hospital { background: linear-gradient(135deg, #ff6b6b, #ee5a24); box-shadow: 0 4px 14px rgba(238,90,36,.3) }
.isle-icon.station { background: linear-gradient(135deg, #74b9ff, #0984e3); box-shadow: 0 4px 14px rgba(9,132,227,.3) }
.isle-icon.market { background: linear-gradient(135deg, #55efc4, #00b894); box-shadow: 0 4px 14px rgba(0,184,148,.3) }
.isle-head h2 { font-size: 17px; flex: 1; min-width: 0; color: var(--ink) }
.isle-head .badge {
  font-size: 11px; font-weight: 700; padding: 4px 11px;
  border-radius: 999px; white-space: nowrap;
}
.badge-live { background: linear-gradient(135deg, var(--teal), var(--teal2)); color: #fff; animation: pulse 2.5s ease-in-out infinite }
.badge-warn { background: var(--warnbg); color: var(--warn) }
.badge-ok { background: var(--okbg); color: var(--ok) }
.badge-info { background: rgba(116,185,255,.2); color: var(--sky) }
.isle-body { padding: 0 18px 16px }

/* ===== Coral decorations ===== */
.coral-deco {
  position: absolute; top: -6px; right: 16px; font-size: 20px;
  opacity: .6; pointer-events: none;
  animation: sway 3s ease-in-out infinite;
}
@keyframes sway { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) } }

/* ===== Schedule rows ===== */
.sched-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
.sched-row:last-child { border-bottom: 0 }
.sched-date { flex: none; width: 48px; text-align: center }
.sched-date .d {
  font-family: "Fredoka",sans-serif;
  font-size: 28px; font-weight: 700; line-height: 1; color: var(--coral);
}
.sched-date .wd { font-size: 11px; color: var(--mute); margin-top: 2px }
.sched-info { flex: 1; min-width: 0 }
.sched-place { font-weight: 700; font-size: 14.5px }
.sched-meta { font-size: 12.5px; color: var(--mute); margin-top: 1px }
.sched-doc { font-size: 13px; margin-top: 3px }
.sched-doc b { color: var(--coral) }
.sched-today {
  background: linear-gradient(135deg, rgba(116,185,255,.12), rgba(0,184,148,.08));
  border: 1px solid rgba(116,185,255,.25);
  border-radius: 14px; padding: 12px 14px; margin: 0 -4px 8px;
}
.sched-today .sched-date .d { color: var(--sky) }
.tag-today {
  display: inline-block; background: linear-gradient(135deg, var(--sky), #0984e3);
  color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
}

/* ===== Shift tabs ===== */
.shift-tabs { display: flex; gap: 6px; margin-bottom: 14px }
.shift-tab {
  flex: 1; border: 1px solid var(--glassbr); background: var(--glass);
  color: var(--mute); border-radius: 12px; padding: 10px 6px;
  text-align: center; font-weight: 600; font-size: 13px;
  backdrop-filter: blur(4px); transition: all .2s;
}
.shift-tab.on {
  background: linear-gradient(135deg, var(--sky), #0984e3);
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 16px rgba(9,132,227,.3);
}
.shift-tab .st-label { display: block; font-size: 10.5px; opacity: .75; margin-top: 1px }
.checkin-list { display: flex; flex-direction: column; gap: 8px }
.checkin-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--glass);
  border: 1px solid var(--glassbr); border-radius: 12px;
  backdrop-filter: blur(4px);
}
.checkin-row .avatar {
  width: 34px; height: 34px; border-radius: 12px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff; display: grid; place-items: center;
  font-size: 14px; font-weight: 700; flex: none;
}
.checkin-row .ci-name { flex: 1; font-weight: 600; font-size: 14px }
.checkin-row .ci-time { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums }
.ci-badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700 }
.ci-badge.present { background: var(--okbg); color: var(--ok) }
.checkin-form {
  display: flex; gap: 8px; margin-top: 12px;
  padding-top: 12px; border-top: 1px solid var(--line);
}
.checkin-form select { flex: 1; min-width: 0 }

/* ===== Buttons ===== */
.btn {
  border: none; border-radius: 12px; padding: 10px 16px;
  font-weight: 700; display: inline-flex; align-items: center;
  gap: 6px; justify-content: center; white-space: nowrap;
  transition: all .2s;
}
.btn.ok { background: linear-gradient(135deg, var(--teal), var(--teal2)); color: #fff; box-shadow: 0 4px 14px rgba(0,184,148,.3) }
.btn.ok:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,184,148,.4) }
.btn:disabled { opacity: .5; cursor: not-allowed }

/* ===== Supply stats ===== */
.supply-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px }
.ss-card {
  text-align: center; padding: 14px 8px; border-radius: 14px;
  border: 1px solid var(--glassbr); background: var(--glass);
  backdrop-filter: blur(4px); position: relative; overflow: hidden;
}
.ss-card::before {
  content: ""; position: absolute; top: -20px; right: -20px;
  width: 50px; height: 50px; border-radius: 50%; opacity: .15;
}
.ss-card.snack::before { background: #f0962e }
.ss-card.water::before { background: var(--sky) }
.ss-card.rice::before { background: var(--teal) }
.ss-card .ss-icon { font-size: 22px; margin-bottom: 4px }
.ss-card .ss-n { font-family: "Fredoka",sans-serif; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums }
.ss-card.snack .ss-n { color: #f0962e }
.ss-card.water .ss-n { color: var(--sky) }
.ss-card.rice .ss-n { color: var(--teal) }
.ss-card .ss-l { font-size: 11px; color: var(--mute); margin-top: 2px }
.supply-recent {
  font-size: 13px; color: var(--mute);
  padding: 10px 0 2px; border-top: 1px solid var(--line);
}
.supply-recent b { color: var(--ink) }

/* ===== Link button ===== */
.isle-foot { padding: 0 18px 16px }
.link-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 11px; border: 1px dashed var(--glassbr);
  background: var(--glass); color: var(--mute); border-radius: 12px;
  font-size: 13px; font-weight: 600; text-decoration: none;
  backdrop-filter: blur(4px); transition: all .2s;
}
.link-btn:hover { background: rgba(255,255,255,.15); color: var(--ink); border-color: var(--sky) }
.link-btn svg { width: 16px; height: 16px; flex: none }

.empty-msg { text-align: center; padding: 14px 0; color: var(--mute); font-size: 13px }

/* ===== Seabed footer ===== */
.seabed {
  max-width: 960px; margin: 30px auto 0;
  text-align: center; color: rgba(255,255,255,.35);
  font-size: 12px; position: relative; z-index: 1;
}
.seabed .plants { font-size: 28px; letter-spacing: 8px; margin-bottom: 6px; opacity: .5 }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(16px);
  background: linear-gradient(135deg, rgba(10,77,140,.95), rgba(6,42,82,.95));
  color: #fff; padding: 10px 20px; border-radius: 14px;
  box-shadow: var(--shadow-float); font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  z-index: 50; max-width: 90%; text-align: center;
  border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(12px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }

@media (max-width: 640px) {
  .bar .tt h1 { font-size: 18px }
  .clock-time { font-size: 30px }
  .clock-time .sec { font-size: 18px }
  .clock { padding: 10px 18px; gap: 10px }
  input, select { min-height: 44px }
  .btn { min-height: 44px }
}
@media (prefers-reduced-motion: reduce) {
  *, .bubble, .fish, .ray, .pulse-dot, .coral-deco, .badge-live { animation: none !important; transition: none !important }
}
</style>

<!-- Underwater scene -->
<div class="ocean-bg" aria-hidden="true" id="oceanBg"></div>

<!-- Header -->
<div class="topbar">
  <div class="bar">
    <div class="bar-icon">🩸</div>

var DOCS=[
  {code:"D01",name:"นพ.ภูริณัฐ ธีรวิศรุต"},{code:"D02",name:"พญ.ดวงกมล บุญสงค์"},
  {code:"D03",name:"นพ.กิตติธัช วิสาละ"},{code:"D04",name:"นพ.เจตนิพัทธ์ ปัญญา"},
  {code:"D05",name:"นพ.ธัชพล วรานันตกุล"},{code:"D06",name:"พญ.ปิ่นรดา กิ่งโพธิ์ตัน"},
  {code:"D07",name:"พญ.มนัชญา มาลารัตน์"},{code:"D08",name:"พญ.ทิชา สุวีรานุวัฒน์"},
  {code:"D09",name:"พญ.ณัชชา เจนกิจวัฒนาเลิศ"},{code:"D10",name:"พญ.พชรภา เจียรพันธุ์"},
  {code:"D11",name:"พญ.ปุญญิศา ทวี"},{code:"D12",name:"พญ.พชรมน วิเศษคณากุล"},
  {code:"D13",name:"นพ.น่านเจ้า กันทะมัง"},{code:"D14",name:"พญ.วิศรุตา แก้วหัวไทร"},
  {code:"D15",name:"พญ.กษมา บุญนำ"},{code:"D16",name:"นพ.ศุภชัย เชิงดี"},
  {code:"D17",name:"พญ.ศุภิสรา กรดแก้ว"},{code:"D18",name:"พญ.ญาณิศา สาเมือง"},
  {code:"D19",name:"นพ.กันต์ธีร์ ทองสีพราย"},{code:"D20",name:"พญ.ศุภสุดา ยิ่งยง"}
];
var PLACES={1:"ค่ายวิภาวดีรังสิต",3:"ม.ราชภัฏสุราษฎร์ธานี",9:"อ.ชัยบุรี",12:"อ.ท่าฉาง",14:"อ.บ้านตาขุน",18:"อ.วิภาวดี",19:"บ.ซีพีแรม",30:"ม.สงขลานครินทร์ฯ",39:"ร.ร.สุราษฎร์ธานี",41:"วิทยาลัยอาชีวศึกษาฯ",42:"ศาลจังหวัดเวียงสระ",43:"ศูนย์ฝึกตำรวจภูธรภาค 8",47:"ห้างเซ็นทรัลพลาซ่า",49:"บ.สิริสินสุราษฎร์ธานี",62:"รร.วังใต้",64:"ศูนย์การค้าโคลีเซี่ยมฯ",66:"รพ.สต.คลองสระ",67:"ศาลเยาวชน",68:"สนง.เทศบาลนครสุราษฎร์ธานี",69:"วิทยาลัยพยาบาล"};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function docName(c){for(var i=0;i<DOCS.length;i++)if(DOCS[i].code===c)return DOCS[i].name;return c}
function placeName(n){return PLACES[n]||'หน่วยที่ '+n}

// ===== Underwater scene =====
function buildOcean(){
  var bg=document.getElementById('oceanBg'),h='';
  for(var i=0;i<14;i++){
    var s=6+Math.random()*14;
    var l=Math.random()*100;
    var dur=8+Math.random()*14;
    var del=Math.random()*10;
    h+='<div class="bubble" style="left:'+l+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+dur+'s;animation-delay:'+del+'s"></div>';
  }
  h+='<div class="ray" style="left:10%;height:120vh;animation-delay:0s"></div>';
  h+='<div class="ray" style="left:55%;height:100vh;animation-delay:3s;width:80px;transform:rotate(-10deg)"></div>';
  h+='<div class="ray" style="left:80%;height:110vh;animation-delay:1.5s;width:60px;transform:rotate(20deg)"></div>';
  var fishEmoji=['🐟','🐠','🐡','🦈','🐬'];
  for(var f=0;f<4;f++){
    var fy=15+Math.random()*70;
    var fd=18+Math.random()*25;
    var fdel=Math.random()*15;
    h+='<div class="fish" style="top:'+fy+'%;animation-duration:'+fd+'s;animation-delay:'+fdel+'s">'+fishEmoji[f%fishEmoji.length]+'</div>';
  }
  bg.innerHTML=h;
}

// ===== Real-time clock =====
function updateClock(){
  var d=new Date();
  var h=pad(d.getHours()),m=pad(d.getMinutes()),s=pad(d.getSeconds());
  document.getElementById('clockTime').innerHTML=h+':'+m+'<span class="sec">:'+s+'</span>';
  document.getElementById('clockDay').textContent='วัน'+W[d.getDay()];
  document.getElementById('clockDate').textContent=d.getDate()+' '+M[d.getMonth()]+' '+(d.getFullYear()+543);
}

// ===== Theme =====
var THEMES=['auto','light','dark'],theme='auto';
try{var t=localStorage.getItem('dashTheme');if(THEMES.indexOf(t)>=0)theme=t}catch(e){}
function applyTheme(){
  var r=document.documentElement;
  if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);
  var btn=document.getElementById('themeBtn');if(!btn)return;
  var icons={auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',dark:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'};
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+icons[theme]+'</svg>';
}
document.getElementById('themeBtn').addEventListener('click',function(){
  theme=THEMES[(THEMES.indexOf(theme)+1)%3];
  try{localStorage.setItem('dashTheme',theme)}catch(e){}applyTheme();
});

// ===== Schedule =====
function renderSchedule(){
  var tdy=todayISO();
  var upcoming=SEED_EVENTS.filter(function(e){return e.date>=tdy}).slice(0,5);
  if(!upcoming.length){
    document.getElementById('schedBody').innerHTML='<div class="empty-msg">🐡 ไม่มีเวรในช่วงนี้</div>';
    document.getElementById('schedBadge').textContent='ว่าง';
    document.getElementById('schedBadge').className='badge badge-info';
    return;
  }
  var todayEv=SEED_EVENTS.filter(function(e){return e.date===tdy});
  var badge=document.getElementById('schedBadge');
  badge.textContent=todayEv.length?'วันนี้มีเวร':'เวรถัดไป';
  badge.className='badge '+(todayEv.length?'badge-live':'badge-info');

  var html='';
  upcoming.forEach(function(ev){
    var d=new Date(ev.date.replace(/-/g,'/'));
    var isToday=ev.date===tdy;
    var docs=ev.codes.map(function(c){return docName(c)}).join(', ');
    if(isToday){
      html+='<div class="sched-today"><div style="display:flex;gap:14px;align-items:flex-start">';
      html+='<div class="sched-date"><div class="d">'+d.getDate()+'</div><div class="wd">'+W[d.getDay()]+'</div></div>';
      html+='<div class="sched-info"><div class="sched-place">'+esc(placeName(ev.n))+'<span class="tag-today">วันนี้</span></div>';
      html+='<div class="sched-meta">'+esc(ev.time)+'</div>';
      html+='<div class="sched-doc"><b>'+esc(ev.codes.join(', '))+'</b> '+esc(docs)+'</div>';
      html+='</div></div></div>';
    } else {
      html+='<div class="sched-row">';
      html+='<div class="sched-date"><div class="d">'+d.getDate()+'</div><div class="wd">'+W[d.getDay()]+'</div></div>';
      html+='<div class="sched-info"><div class="sched-place">'+esc(placeName(ev.n))+'</div>';
      html+='<div class="sched-meta">'+esc(ev.time)+'</div>';
      html+='<div class="sched-doc"><b>'+esc(ev.codes.join(', '))+'</b> '+esc(docs)+'</div>';
      html+='</div></div>';
    }
  });
  document.getElementById('schedBody').innerHTML=html;
}

// ===== Room duty =====
var currentShift='morning', roomData={};
function detectShift(){var h=new Date().getHours();if(h>=8&&h<16)return'morning';if(h>=16)return'afternoon';return'night'}
function loadRoomData(){try{var r=localStorage.getItem('bbRoomDuty');if(r)roomData=JSON.parse(r)}catch(e){roomData={}}if(!roomData||typeof roomData!=='object')roomData={}}
function saveRoomData(){try{localStorage.setItem('bbRoomDuty',JSON.stringify(roomData))}catch(e){}}
function getRoomKey(s){return todayISO()+'_'+s}
function getCheckins(s){return roomData[getRoomKey(s)]||[]}

function renderRoom(){
  var tabs='';
  SHIFTS.forEach(function(s){
    var c=getCheckins(s.id).length;
    tabs+='<button class="shift-tab'+(currentShift===s.id?' on':'')+'" data-shift="'+s.id+'">';
    tabs+=s.label+(c?' ('+c+')':'')+'<span class="st-label">'+s.time+'</span></button>';
  });
  document.getElementById('shiftTabs').innerHTML=tabs;

  var list=getCheckins(currentShift);
  var totalToday=0;
  SHIFTS.forEach(function(s){totalToday+=getCheckins(s.id).length});
  document.getElementById('roomBadge').textContent=totalToday+' คน';

  if(!list.length){
    document.getElementById('checkinList').innerHTML='<div class="empty-msg">🫧 ยังไม่มีคนลงชื่อเวรนี้</div>';
  } else {
    var h='';
    list.forEach(function(item){
      h+='<div class="checkin-row"><div class="avatar">'+esc(item.name.charAt(0))+'</div>';
      h+='<div class="ci-name">'+esc(item.name)+'</div>';
      h+='<div class="ci-time">'+esc(item.time)+'</div>';
      h+='<span class="ci-badge present">มาแล้ว</span></div>';
    });
    document.getElementById('checkinList').innerHTML=h;
  }
  var sel=document.getElementById('staffSelect');
  var checked=list.map(function(c){return c.name});
  var opts='<option value="">— เลือกชื่อ —</option>';
  STAFF.forEach(function(name){if(checked.indexOf(name)<0)opts+='<option value="'+esc(name)+'">'+esc(name)+'</option>'});
  sel.innerHTML=opts;
}

document.getElementById('shiftTabs').addEventListener('click',function(e){
  var btn=e.target.closest('[data-shift]');if(!btn)return;
  currentShift=btn.dataset.shift;renderRoom();
});
document.getElementById('checkinBtn').addEventListener('click',function(){
  var sel=document.getElementById('staffSelect'),name=sel.value;if(!name)return;
  var now=new Date(),time=pad(now.getHours())+':'+pad(now.getMinutes());
  var key=getRoomKey(currentShift);
  if(!roomData[key])roomData[key]=[];
  roomData[key].push({name:name,time:time});
  saveRoomData();renderRoom();
  toast('🐬 '+name+' ลงชื่อเวร'+SHIFTS.filter(function(s){return s.id===currentShift})[0].label+'แล้ว');
});

// ===== Supply =====
var supplyData=[];
function loadSupply(){try{var r=localStorage.getItem('bbSupplyDash');if(r)supplyData=JSON.parse(r)}catch(e){supplyData=[]}if(!Array.isArray(supplyData))supplyData=[]}
function renderSupply(){
  var now=new Date(),ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
  var recs=supplyData.filter(function(r){return r.date&&r.date.slice(0,7)===ym});
  var ts=0,tw=0,tr=0;
  recs.forEach(function(r){ts+=(r.snack||0);tw+=(r.water||0);tr+=(r.rice||0)});
  document.getElementById('ssSnack').textContent=ts||'—';
  document.getElementById('ssWater').textContent=tw||'—';
  document.getElementById('ssRice').textContent=tr||'—';
  var badge=document.getElementById('supplyBadge');
  badge.textContent=recs.length+' รายการ';
  badge.className='badge '+(recs.length?'badge-ok':'badge-info');
  if(recs.length){
    var last=recs[recs.length-1];
    document.getElementById('supplyRecent').innerHTML='ล่าสุด: <b>'+esc(last.place||last.date)+'</b> — ขนม '+(last.snack||0)+', น้ำ '+(last.water||0)+', ข้าว '+(last.rice||0);
  } else {
    document.getElementById('supplyRecent').textContent=M[now.getMonth()]+' '+(now.getFullYear()+543)+' — ยังไม่มีรายการ';
  }
}

// ===== Toast =====
var _tt=null;
function toast(msg){
  var el=document.getElementById('toast');el.textContent=msg;el.className='toast show';
  clearTimeout(_tt);_tt=setTimeout(function(){el.className='toast'},2400);
}

// ===== Init =====
buildOcean();
updateClock(); setInterval(updateClock, 1000);
applyTheme();
currentShift=detectShift();
loadRoomData(); renderSchedule(); renderRoom();
loadSupply(); renderSupply();

try{
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-7);
  var cutKey=cutoff.getFullYear()+'-'+pad(cutoff.getMonth()+1)+'-'+pad(cutoff.getDate());
  Object.keys(roomData).forEach(function(k){if(k<cutKey)delete roomData[k]});
  saveRoomData();
}catch(e){}

})();
</script>
